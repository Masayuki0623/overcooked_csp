<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- スマホで倍率が変わらないようにする。ダブルタップや二本指で拡大されると、
     盤面と操作ボタンの位置がずれて遊べなくなる。 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Overcooked CSP</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1e2229;
    --text: #e8eaed;
    --muted: #9aa2ad;
    --bad: #e8697d;
    --btn-bg: #2a2f38;
    --btn-line: #3a414c;
    /* 操作ボタンの大きさと、画面下からの高さ。設定画面から変えられる。 */
    --btn: 64px;
    --lift: 16px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: var(--bg);
    /* ダブルタップでの拡大を止める(iOS は viewport の user-scalable を
       無視するので、こちらで止める)。指1本の操作と画面送りはそのまま。 */
    touch-action: manipulation;
    /* 横向きにしたときに字だけ勝手に大きくならないように */
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  body {
    color: var(--text);
    font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", sans-serif;
    padding: 16px 24px 32px;
    /* ボタンを連打したときに、文字選択やダブルタップ拡大が起きないように */
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  /* ---- 上の帯 ---- */
  .bar {
    display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center;
    background: var(--panel); border-radius: 8px; padding: 8px 12px;
    font-size: 12.5px; color: var(--muted); margin-bottom: 12px;
  }
  .bar b { color: var(--text); font-weight: 600; }
  /* バグ報告。設定の隣に置く。盤面や操作ボタンには重ねない */
  #bug { border-color: #6b4a4a; color: #ffbcbc; }
  #bug:hover { background: #3a2a2a; }
  .bar .title { color: var(--text); font-weight: 600; font-size: 14px; margin-right: 4px; }
  .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--bad); margin-right: 6px; vertical-align: middle;
  }
  .dot.on { background: #6bd08a; }
  #gear {
    margin-left: auto; font: inherit; font-size: 13px; color: var(--text);
    background: var(--btn-bg); border: 1px solid var(--btn-line); border-radius: 6px;
    padding: 5px 10px;
  }

  /* ---- ゲーム画面 ---- */
  /* 盤面のまわりでは、拡大も画面送りもしない */
  #stage { position: relative; display: flex; align-items: flex-start; gap: 12px;
           touch-action: none; }
  #stage canvas {
    image-rendering: pixelated; display: block; background: #000;
    border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.45);
    /* 盤面の上では拡大も画面送りもしない */
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  #panel { cursor: pointer; touch-action: none; }
  #panel.hidden { display: none; }

  /* ---- 操作ボタン ---- */
  #pad {
    display: flex; align-items: center; justify-content: space-between;
    /* 十字キーと「使う」の間は必ず離す(隣り合っていると押し間違える) */
    gap: clamp(28px, 10vw, 80px);
    margin-top: 16px; width: min(100%, 560px); touch-action: none;
  }
  #pad.dpad-right { flex-direction: row-reverse; }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, var(--btn));
    grid-template-rows: repeat(3, var(--btn));
    gap: calc(var(--btn) * 0.1);
  }
  .dpad .up    { grid-column: 2; grid-row: 1; }
  .dpad .left  { grid-column: 1; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .dpad .down  { grid-column: 2; grid-row: 3; }
  /* 手を出すボタン。十字キーの右隣に、少し大きめに置く
     (十字キーを左手、こちらを右手の親指で押せるように) */
  #pad .act {
    flex: 0 0 auto;
    width: calc(var(--btn) * 1.4); height: calc(var(--btn) * 1.4);
    border-radius: 50%; background: #2f6f4b; border-color: #3f8a60;
    font-size: calc(var(--btn) * 0.28);
  }
  .actions { display: flex; flex-direction: column; gap: 10px; }
  #pad button {
    font: inherit; font-size: calc(var(--btn) * 0.38); color: var(--text);
    background: var(--btn-bg); border: 1px solid var(--btn-line); border-bottom-width: 3px;
    border-radius: 10px; touch-action: none; -webkit-tap-highlight-color: transparent;
    padding: 0;
  }
  #pad .actions button {
    font-size: 15px; height: calc(var(--btn) * 0.9); min-width: calc(var(--btn) * 1.6);
    padding: 0 14px;
  }
  #pad button.pressed { background: #3b4350; transform: translateY(2px); border-bottom-width: 1px; }

  /* 指示の選択。ゲーム画面を隠さないよう、ボタンと同じ下側に出す */
  #instruct {
    display: none; width: min(100%, 560px); margin-top: 16px; text-align: center;
    /* 十字キーと同じ高さを取り、盤面の位置がずれないようにする
       (実際の高さは出すときに JS でボタンに合わせる) */
    box-sizing: border-box; min-height: calc(var(--btn) * 3.2);
  }
  #instruct.show { display: flex; flex-direction: column; justify-content: center; }
  #instruct .lead, #instruct .who { flex: 0 0 auto; }
  body.compact #instruct {
    margin-top: 8px;
    padding-bottom: calc(env(safe-area-inset-bottom) + var(--lift));
  }
  #pad.hidden { display: none; }
  #instruct .lead { font-size: 14px; margin-bottom: 4px; }
  #instruct .who {
    display: flex; gap: 14px; justify-content: center; align-items: center;
    font-size: 12.5px; color: var(--muted); margin-bottom: 8px;
  }
  #instruct .who span { display: flex; align-items: center; gap: 5px; }
  #instruct .who img { width: 26px; height: 26px; image-rendering: pixelated; }
  #instruct .cards {
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    /* 候補が多いとボタンの高さに収まらない。枠の中だけで送れるようにする */
    overflow-y: auto; overscroll-behavior: contain; max-height: 100%;
  }
  #instruct .cards button {
    font: inherit; font-size: 14px; color: var(--text); background: var(--btn-bg);
    border: 1px solid var(--btn-line); border-bottom-width: 3px; border-radius: 10px;
    padding: 8px 12px; display: flex; align-items: center; gap: 8px; min-height: 52px;
  }
  #instruct .cards button:active { background: #3b4350; transform: translateY(2px); }
  #instruct .cards button.on {
    background: #2b5f4a; border-color: #4fd39a; border-bottom-width: 3px;
  }
  #instruct .go { margin-top: 10px; text-align: center; }
  #instruct .go button {
    font: inherit; font-size: 15px; font-weight: 700; color: var(--text);
    background: #2f6f57; border: 1px solid #4fd39a; border-bottom-width: 3px;
    border-radius: 10px; padding: 10px 28px; min-width: 140px;
  }
  #instruct .go button:disabled {
    background: var(--btn-bg); border-color: var(--btn-line); color: var(--muted);
  }
  #instruct .go button:not(:disabled):active { transform: translateY(2px); }
  #instruct .cards img { width: 30px; height: 30px; image-rendering: pixelated; }
  #instruct .cards .act { color: var(--muted); font-size: 12px; }

  .keys { font-size: 12.5px; color: var(--muted); line-height: 1.9; margin-top: 14px; }
  kbd {
    background: var(--btn-bg); border: 1px solid var(--btn-line); border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 7px; font-family: inherit; font-size: 12px; color: var(--text);
  }

  /* ---- スマホ(狭い画面・指で触る端末) ----
     ページ全体を画面の高さに収めてスクロールさせない。スクロールできると、
     ボタンを押したつもりが画面が動いただけ、ということが起きる。
     ボタンは画面下に固定し、OS のジェスチャー領域(ホームバー)の分だけ
     持ち上げる。 */
  /* ---- パソコンの画面 ----
     指で触る端末とは作りを分ける。こちらはキーボードで操作するので、
     画面の操作ボタンは出さず、盤面を画面の真ん中に置く。
     スクロールさせない(下のほうが見切れていた)。 */
  body:not(.compact) {
    height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
    padding: 16px 24px;
  }
  body:not(.compact) #stage {
    flex: 1; min-height: 0; justify-content: center; align-items: center;
  }
  /* 操作ボタンは出さない。設定はそのボタンの設定なので、こちらも出さない */
  body:not(.compact) #pad, body:not(.compact) #gear { display: none; }
  /* 操作の説明は、盤面の邪魔にならないよう右端へ小さく置く */
  body:not(.compact) .keys {
    position: fixed; right: 24px; top: 50%; transform: translateY(-50%);
    width: 200px; margin: 0; text-align: left; line-height: 1.8;
    display: flex; flex-direction: column; gap: 14px;
  }
  .keys .k-title {
    color: var(--text); font-weight: 600; font-size: 13px;
    border-bottom: 1px solid var(--btn-line); padding-bottom: 4px;
  }

  body.compact {
    height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 8px) 10px 0;
  }
  body.compact .bar { font-size: 11.5px; padding: 6px 10px; gap: 4px 12px; margin-bottom: 8px; }
  body.compact .bar .title, body.compact #cfg, body.compact .keys { display: none; }
  /* スマホでは短い字にする。絵文字だけだと何のボタンか分からない。
     バーが2段になると盤面がそのぶん下がり、下のボタンが見切れるので、
     字数を詰めて1段に収める。 */
  body.compact #bug { font-size: 0; padding: 4px 8px; }
  body.compact #bug::before { content: 'バグ報告'; font-size: 11.5px; }
  body.compact #stage {
    flex: 1; min-height: 0; justify-content: center; align-items: center;
  }
  /* 指示パネルはゲーム画面の上に重ねる(選んでいる間はゲームが止まっている) */
  body.compact #panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  body.compact #pad {
    justify-content: space-between; gap: clamp(28px, 10vw, 80px);
    margin-top: 8px; width: 100%;
    padding-bottom: calc(env(safe-area-inset-bottom) + var(--lift));
  }

  /* ---- 重ね表示 ---- */
  #overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(10,12,15,.84); font-size: 16px; text-align: center; padding: 24px; z-index: 10;
    /* 画面に収まらない内容(選択肢が多いとき等)は縦に送れるようにする。
       小さい画面では選ぶ項目が増えると下が見切れてしまうため。 */
    overflow-y: auto; overscroll-behavior: contain;
  }
  #overlay.show { display: flex; }
  #overlay > div { margin: auto; max-width: 100%; }
  /* カウントダウン中は盤面が見えるよう、背景を薄くする */
  #overlay.countdown { background: rgba(10,12,15,.35); }
  #overlay .cd {
    font-size: 120px; font-weight: 800; line-height: 1;
    text-shadow: 0 4px 24px rgba(0,0,0,.6);
  }
  #overlay button:disabled { opacity: .55; }
  #overlay .big { font-size: 20px; font-weight: 600; margin-bottom: 10px; }
  /* ---- 最初の選択(チュートリアル/練習/実験) ---- */
  .modes { display: flex; flex-direction: column; gap: 10px; margin: 14px 0 4px; }
  .modes button {
    display: block; width: 100%; text-align: left; padding: 12px 14px;
    font: inherit; color: var(--text); background: var(--btn-bg);
    border: 1px solid var(--btn-line); border-radius: 10px; cursor: pointer;
  }
  .modes button:hover { background: #333c48; }
  .modes .name { font-size: 16px; font-weight: 600; }
  .modes .why { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.6; }
  /* ---- レシピ表 ---- */
  .recipe { display: flex; flex-wrap: wrap; justify-content: center;
            align-items: flex-start; gap: 4px; margin: 14px 0; }
  .recipe .step { width: 84px; text-align: center; }
  .recipe .step img { width: 44px; height: 44px; image-rendering: pixelated; }
  .recipe .step .cap { font-size: 11.5px; color: var(--muted); line-height: 1.5;
                       margin-top: 4px; }
  .recipe .arrow { align-self: center; color: var(--muted); font-size: 18px;
                   padding-bottom: 18px; }
  .dishes { font-size: 13.5px; color: var(--text); line-height: 1.9; margin: 6px 0 2px; }
  #overlay .sub { color: var(--muted); font-size: 14px; line-height: 1.8; }
  #overlay .count { font-size: 40px; font-weight: 700; margin: 14px 0 4px; }
  #overlay button, #settings button {
    margin-top: 20px; font: inherit; font-size: 16px; color: var(--text);
    background: var(--btn-bg); border: 1px solid var(--btn-line); border-bottom-width: 3px;
    border-radius: 10px; padding: 12px 28px;
  }
  #overlay button.primary { background: #2f6f4b; border-color: #3f8a60; font-size: 18px; padding: 14px 40px; }

  /* ---- ステージ選択 ---- */
  #overlay .stage-pick { width: min(520px, 100%); text-align: left; }
  #overlay .stage-pick .big { text-align: center; }
  .pick { margin-top: 18px; }
  .pick .lab { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .pick .opts { display: flex; gap: 8px; flex-wrap: wrap; }
  #overlay .pick .opts button {
    margin: 0; flex: 1 1 0; min-width: 90px; padding: 10px 8px; font-size: 15px;
  }
  #overlay .pick .opts button.on { background: #3b4350; border-color: #8a96a8; }
  .pick .hint { font-size: 12.5px; color: var(--muted); margin-top: 6px; min-height: 1.4em; }
  .pick select {
    width: 100%; font: inherit; font-size: 14px; color: var(--text);
    background: var(--btn-bg); border: 1px solid var(--btn-line); border-radius: 8px;
    padding: 10px;
  }
  #overlay .stage-pick .go { text-align: center; }
  .pick input[type=text] {
    width: 100%; padding: 10px 12px; font-size: 16px; border-radius: 8px;
    background: #2a3039; color: var(--fg); border: 1px solid #47505d;
  }
  /* アンケート。項目が多いので、画面に収まらなければ中だけ縦に送る */
  #overlay.form { align-items: flex-start; overflow-y: auto; }
  /* アンケートは答えることに集中してもらう。盤面が透けていると文字が
     読みにくいので、背景を完全に塗りつぶし、操作ボタンも隠す。 */
  #overlay.solid { background: var(--bg); }
  body.survey #stage, body.survey #pad, body.survey #instruct,
  body.survey .bar { display: none !important; }
  #overlay .survey { width: min(560px, 100%); text-align: left; }
  #overlay .survey .big { text-align: center; }
  #overlay .survey h3 {
    font-size: 15px; margin: 22px 0 4px; padding-top: 14px;
    border-top: 1px solid #333b45;
  }
  #overlay .survey .lead { font-size: 13px; color: var(--muted); line-height: 1.7; }
  #overlay .survey .q { margin-top: 14px; }
  #overlay .survey .q .text { font-size: 15px; margin-bottom: 6px; }
  #overlay .survey .q.todo .text { color: #ffb4b4; }
  #overlay .survey .scale { display: flex; gap: 6px; flex-wrap: wrap; }
  #overlay .survey .scale label {
    flex: 1 1 0; min-width: 44px; text-align: center; font-size: 12px;
    color: var(--muted); cursor: pointer;
  }
  #overlay .survey .scale label span {
    display: block; padding: 10px 0; margin-bottom: 4px; border-radius: 8px;
    background: #2a3039; border: 1px solid #47505d; font-size: 15px; color: var(--fg);
  }
  #overlay .survey .scale input { position: absolute; opacity: 0; pointer-events: none; }
  #overlay .survey .scale input:checked + span {
    background: #2f6f4b; border-color: #3f8a60; font-weight: 700;
  }
  #overlay .survey .scale label.dnf { flex: 1 1 100%; }
  /* 0〜7 は数字だけなので細くしてよい(1行に収める) */
  #overlay .survey .scale.num { gap: 4px; }
  #overlay .survey .scale.num label { min-width: 0; }
  #overlay .survey .anchors {
    display: flex; justify-content: space-between; gap: 8px;
    font-size: 11.5px; color: var(--muted); margin: 4px 0 6px;
  }
  #overlay .survey textarea {
    width: 100%; box-sizing: border-box; resize: vertical;
    background: #11141a; color: var(--fg); border: 1px solid #39404b;
    border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 14px;
    line-height: 1.6;
  }
  #overlay .survey textarea:focus { outline: none; border-color: #8fd3a8; }
  #overlay .survey .err { color: #ffb4b4; font-size: 13.5px; min-height: 1.4em; margin-top: 10px; }

  #toast {
    position: fixed; left: 50%; top: 64px; transform: translateX(-50%);
    background: var(--btn-bg); border: 1px solid var(--btn-line); border-radius: 8px;
    padding: 10px 16px; font-size: 14px; opacity: 0; pointer-events: none;
    transition: opacity .2s; max-width: calc(100% - 32px); text-align: center; z-index: 20;
  }
  #toast.show { opacity: 1; }

  /* ---- 設定 ---- */
  #settings {
    position: fixed; inset: 0; display: none; align-items: flex-end; justify-content: center;
    background: rgba(10,12,15,.6); z-index: 30;
  }
  #settings.show { display: flex; }
  #settings .sheet {
    width: min(480px, 100%); background: var(--panel); border-radius: 14px 14px 0 0;
    padding: 18px 20px calc(env(safe-area-inset-bottom) + 18px);
  }
  #settings h2 { font-size: 16px; margin: 0 0 14px; }
  #settings label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  #settings label b { color: var(--text); font-weight: 600; }
  #settings input[type=range] { width: 100%; }
  #settings .seg { display: flex; gap: 8px; }
  #settings .seg button { margin: 0; flex: 1; padding: 10px; font-size: 14px; }
  #settings .seg button.on { background: #3b4350; border-color: #6b7686; }
  #settings .row { display: flex; gap: 10px; }
  #settings .row button { flex: 1; }

    /* デバッグ設定。普段は畳んでおく */
    details.dbg { margin: 10px 0; text-align: left; border: 1px solid #0003;
                  border-radius: 8px; padding: 6px 10px; }
    details.dbg > summary { cursor: pointer; font-size: 13px; opacity: .85; }
    .dbg-row { display: flex; align-items: center; gap: 8px; margin: 6px 0;
               font-size: 13px; }
    .dbg-row > span { min-width: 11em; }
    .dbg-row > input[type=number] { width: 6em; }
    .dbg-row > em { opacity: .7; font-size: 11px; font-style: normal; }
</style>
</head>
<body>

<div class="bar">
  <span class="title">Overcooked CSP</span>
  <span><span id="conn-dot" class="dot"></span><span id="conn">接続中...</span></span>
  <span>RTT <b id="rtt">--</b> ms</span>
  <span><b id="fps">--</b> fps</span>
  <span>描画 <b id="paintms">--</b> ms</span>
  <span>状態 <b id="state">--</b></span>
  <span id="cfg"></span>
  <button id="bug" type="button" aria-label="バグを報告">バグを報告</button>
  <button id="gear" type="button" aria-label="ボタンの設定">⚙ 設定</button>
</div>

<div id="stage">
  <canvas id="game" width="320" height="400"></canvas>
  <canvas id="panel" class="hidden" width="1" height="1"></canvas>
</div>

<div id="instruct">
  <div class="lead" id="instruct-lead">AIに最初の指示を出してください</div>
  <div class="who" id="instruct-who"></div>
  <div class="cards" id="instruct-cards"></div>
  <div class="go" id="instruct-go">
    <button type="button" id="instruct-ok" disabled>決定</button>
  </div>
</div>

<div id="pad">
  <div class="dpad">
    <button class="up"    data-code="ArrowUp"    aria-label="上">▲</button>
    <button class="left"  data-code="ArrowLeft"  aria-label="左">◀</button>
    <button class="right" data-code="ArrowRight" aria-label="右">▶</button>
    <button class="down"  data-code="ArrowDown"  aria-label="下">▼</button>
  </div>
  <button class="act" data-code="Space" data-repeat="1" aria-label="使う">使う</button>
</div>

<div class="keys">
  <div class="k-title">操作</div>
  <div><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> または <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><br>
    向きを変える / 進む</div>
  <div><kbd>Space</kbd><br>向いている先に手を出す<br>（拾う / 置く / 刻む）</div>
  <div><kbd>Enter</kbd> AIへの指示<br><kbd>Esc</kbd> 閉じる</div>
</div>

<div id="overlay"><div id="overlay-text"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<div id="settings" role="dialog" aria-label="ボタンの設定">
  <div class="sheet">
    <h2>ボタンの設定</h2>
    <label>ボタンの大きさ <b id="size-val"></b></label>
    <input id="size" type="range" min="44" max="100" step="2">
    <label>画面下からの高さ <b id="lift-val"></b></label>
    <input id="lift" type="range" min="0" max="200" step="4">
    <label>十字キーの位置</label>
    <div class="seg">
      <button type="button" data-side="left">左</button>
      <button type="button" data-side="right">右</button>
    </div>
    <div class="row">
      <button type="button" id="reset">初期値に戻す</button>
      <button type="button" id="done">閉じる</button>
    </div>
  </div>
</div>

<script>
(function () {
  const gameCv = document.getElementById('game');
  const panelCv = document.getElementById('panel');
  const stage = document.getElementById('stage');
  const pad = document.getElementById('pad');
  document.getElementById('bug').addEventListener('click', () => showBugForm());
  const gameCtx = gameCv.getContext('2d');
  const panelCtx = panelCv.getContext('2d');

  const el = {
    conn: document.getElementById('conn'),
    dot: document.getElementById('conn-dot'),
    rtt: document.getElementById('rtt'),
    fps: document.getElementById('fps'),
    state: document.getElementById('state'),
    cfg: document.getElementById('cfg'),
    overlay: document.getElementById('overlay'),
    overlayText: document.getElementById('overlay-text'),
  };

  // ---- 倍率を変えさせない --------------------------------------------
  // 二本指の拡大は、iOS では viewport の指定では止まらない。拡大されると
  // 盤面と操作ボタンの位置がずれて遊べなくなるので、ここで止める。
  // (この2つの出来事は二本指のときだけ起きるので、普通の操作には触らない)
  ['gesturestart', 'gesturechange'].forEach((name) => {
    document.addEventListener(name, (e) => e.preventDefault(), { passive: false });
  });
  // ダブルタップでの拡大は、iOS では touch-action だけでは止まらないことが
  // ある。同じ場所を続けて2回叩いたときだけ、2回目の既定の動き(拡大)を
  // 止める。画面の中のボタンは click で動いているので、そこには触らない
  // (止めると押せなくなる)。操作ボタンは pointerdown で動いているので、
  // ここで止めても効かなくならない。
  let lastTap = { t: 0, x: 0, y: 0 };
  document.addEventListener('touchend', (e) => {
    const touch = e.changedTouches && e.changedTouches[0];
    const now = Date.now();
    const x = touch ? touch.clientX : 0;
    const y = touch ? touch.clientY : 0;
    const samePlace = Math.abs(x - lastTap.x) < 40 && Math.abs(y - lastTap.y) < 40;
    const control = e.target && e.target.closest
      && e.target.closest('button, input, textarea, select, a, label');
    if (!control && now - lastTap.t < 400 && samePlace) e.preventDefault();
    lastTap = { t: now, x, y };
  }, { passive: false });
  // 念のため、ダブルタップが click 2回として届いたときの既定の動きも止める。
  document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

  // ---- 画面の型 ------------------------------------------------------
  // 指で触る端末か、幅の狭い画面では、スマホ用の配置にする。
  function updateCompact() {
    const touch = matchMedia('(pointer: coarse)').matches;
    document.body.classList.toggle('compact', touch || window.innerWidth <= 700);
  }
  updateCompact();

  // ---- ボタンの設定(端末ごとに保存) -----------------------------------
  // 画面下の端は OS のジェスチャー(ホームバー)と重なりやすいので、少し持ち上げておく。
  const DEFAULTS = { size: 64, lift: 28, side: 'left' };
  const STORE = 'overcooked-pad-v1';
  let prefs = Object.assign({}, DEFAULTS);
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (saved) prefs = Object.assign(prefs, saved);
  } catch (e) { /* 保存できない環境(プライベートモード等)では既定値のまま */ }

  // 画面幅に収まるボタンの大きさの上限。横一列に、十字キー3つ分と
  // 「使う」ボタン(1.4倍)が並び、その間に必ず隙間(画面幅の1割)を空ける。
  // はみ出すと端のボタンが画面の外に出て押せなくなるので、それ以上は
  // 大きくしない。
  function maxButtonSize() {
    const gap = Math.min(80, Math.max(28, window.innerWidth * 0.1));
    return Math.floor((window.innerWidth - 40 - gap) / 4.4);
  }

  function applyPrefs() {
    const cap = maxButtonSize();
    const size = Math.max(40, Math.min(prefs.size, cap));
    document.documentElement.style.setProperty('--btn', size + 'px');
    document.documentElement.style.setProperty('--lift', prefs.lift + 'px');
    pad.classList.toggle('dpad-right', prefs.side === 'right');
    document.getElementById('size').value = prefs.size;
    document.getElementById('lift').value = prefs.lift;
    document.getElementById('size-val').textContent =
      size < prefs.size ? `${size}px (画面幅に合わせて制限)` : `${prefs.size}px`;
    document.getElementById('lift-val').textContent = prefs.lift + 'px';
    document.querySelectorAll('#settings [data-side]').forEach((b) =>
      b.classList.toggle('on', b.dataset.side === prefs.side));
    fitAll();
  }
  function savePrefs() {
    try { localStorage.setItem(STORE, JSON.stringify(prefs)); } catch (e) {}
  }

  const settings = document.getElementById('settings');
  document.getElementById('gear').addEventListener('click', () => settings.classList.add('show'));
  document.getElementById('done').addEventListener('click', () => settings.classList.remove('show'));
  settings.addEventListener('click', (e) => { if (e.target === settings) settings.classList.remove('show'); });
  document.getElementById('size').addEventListener('input', (e) => {
    prefs.size = +e.target.value; applyPrefs(); savePrefs();
  });
  document.getElementById('lift').addEventListener('input', (e) => {
    prefs.lift = +e.target.value; applyPrefs(); savePrefs();
  });
  document.querySelectorAll('#settings [data-side]').forEach((b) =>
    b.addEventListener('click', () => { prefs.side = b.dataset.side; applyPrefs(); savePrefs(); }));
  document.getElementById('reset').addEventListener('click', () => {
    prefs = Object.assign({}, DEFAULTS); applyPrefs(); savePrefs();
  });

  // ---- 大きさ合わせ ----------------------------------------------------
  // サーバー側 Surface の大きさ。base はゲーム画面のみ、full は指示パネル込み。
  let baseW = 320, baseH = 400;
  let fullW = 320, fullH = 400;
  const MAX_SCALE = 1.5;   // ドット絵なので少しだけ拡大する

  function fit(cv, w, h) {
    if (cv.width !== w) cv.width = w;
    if (cv.height !== h) cv.height = h;
    // 残りの場所に、縦横とも収める。横だけで決めると、パソコンの画面で
    // 下のほうが見切れていた。
    const availW = stage.clientWidth || document.body.clientWidth;
    const availH = stage.clientHeight || document.body.clientHeight;
    let k = Math.min(MAX_SCALE, availW / w, availH / h);
    k = Math.max(k, 0.1);
    cv.style.width = Math.floor(w * k) + 'px';
    cv.style.height = Math.floor(h * k) + 'px';
  }
  function fitAll() {
    fit(gameCv, baseW, baseH);
    if (!panelCv.classList.contains('hidden')) fit(panelCv, panelCv.width, panelCv.height);
  }
  // 盤面を置ける場所の大きさが変わったら、そのつど合わせ直す。
  // 窓の大きさを変えたときだけでなく、指示の帯が出入りして高さが変わった
  // ときにも効く(合わせ直さないと、盤面の下が見切れる)。
  if (window.ResizeObserver) {
    let last = '';
    new ResizeObserver(() => {
      const now = `${stage.clientWidth}x${stage.clientHeight}`;
      if (now === last) return;      // 自分で大きさを変えた分で回り続けない
      last = now;
      fitAll();
    }).observe(stage);
  }

  function applyMeta(msg) {
    if (msg.grid) grid = msg.grid;
    if (msg.tile) tilePx = msg.tile;
    if (msg.hz) stepMs = 1000 / msg.hz;
    baseW = msg.base_w; baseH = msg.base_h;
    fullW = msg.w;      fullH = msg.h;
    fit(gameCv, baseW, baseH);
    const panelW = Math.max(0, fullW - baseW);
    if (panelW > 0) {
      panelCv.classList.remove('hidden');
      fit(panelCv, panelW, fullH);
    } else {
      panelCv.classList.add('hidden');
    }
  }

  // ---- 描画 ------------------------------------------------------------
  let recvTimes = [];
  let drawing = false;
  let queued = null;       // 展開中に届いた最新の1枚

  function rate(times) {
    const now = performance.now();
    while (times.length && now - times[0] > 2000) times.shift();
    return (times.length / 2).toFixed(1);
  }

  function drawBlob(blob) {
    recvTimes.push(performance.now());
    // 展開中なら「最新の1枚」だけ覚えておく。捨てずに、かつ溜めない。
    if (drawing) { queued = blob; return; }
    drawing = true;
    createImageBitmap(blob).then(bmp => {
      // 左 baseW ぶんがゲーム画面、その右が指示パネル。切り分けて別々に描く。
      gameCtx.drawImage(bmp, 0, 0, baseW, baseH, 0, 0, baseW, baseH);
      const panelW = bmp.width - baseW;
      if (panelW > 0) {
        if (panelCv.classList.contains('hidden') || panelCv.width !== panelW
            || panelCv.height !== bmp.height) {
          panelCv.classList.remove('hidden');
          fit(panelCv, panelW, bmp.height);
        }
        panelCtx.drawImage(bmp, baseW, 0, panelW, bmp.height, 0, 0, panelW, bmp.height);
      } else if (!panelCv.classList.contains('hidden')) {
        panelCv.classList.add('hidden');
      }
      bmp.close();
      drawing = false;
      if (!boardDrawn) { boardDrawn = true; boardWaiters.splice(0).forEach((f) => f()); }
      el.fps.textContent = rate(recvTimes);
      if (queued) { const b = queued; queued = null; drawBlob(b); }
    }).catch(() => { drawing = false; });
  }

  // ---- 盤面をこの端末で描く ---------------------------------------------
  // サーバーは画像ではなく「どの絵をどこに描くか」の命令列だけを送ってくる
  // (pygame が描くときに使ったものと同じ)。ここで同じ順に描き直すので、
  // 見た目はローカル版と同じになる。?mode=png にすると従来の画像方式。
  const MODE = new URLSearchParams(location.search).get('mode') === 'png' ? 'png' : 'draw';
  const defs = new Map();   // 番号 -> 命令
  let seq = [];             // いまのコマで描く命令の番号の列
  const sprites = new Map();
  // 絵の版。絵を描き直したとき、端末が前の絵を使い回さないようにする
  // (URL が同じだと、しまい込んだ古い絵をそのまま出してしまう)。
  // サーバーがこのページを配るときに埋める。埋まっていなければ
  // (ファイルを直接開いたときなど)版なしで動く。
  let gfxVer = '__GFX_VER__';
  if (gfxVer.indexOf('__') === 0) gfxVer = '';
  function gfxUrl(name) {
    return '/graphics/' + encodeURIComponent(name) + '.png'
      + (gfxVer ? '?v=' + gfxVer : '');
  }
  function setGfxVersion(v) {
    if (!v || v === gfxVer) return;
    gfxVer = v;
    sprites.clear();          // 版が分かる前に作った分は作り直す
  }

  function sprite(name) {
    let im = sprites.get(name);
    if (!im) {
      im = new Image();
      // 初めて使う絵は読み込み待ちになる。読み込めたら描き直す。
      im.onload = () => { bgIds = []; paint(); };
      im.src = gfxUrl(name);
      sprites.set(name, im);
    }
    return im;
  }
  function rgb(e, i) { return `rgb(${e[i]},${e[i + 1]},${e[i + 2]})`; }

  // 背景(床・台・器具など、ほとんど変わらない先頭の命令)は別の画用紙に
  // 一度だけ描いておき、毎回はそれを貼ってから残りだけ描く。全部を毎回
  // 描き直すと、この PC でも 1回 23ms かかり、スマホでは描画が追いつかず
  // 操作の応答まで遅れていた。
  const bgCanvas = document.createElement('canvas');
  const bgCtx = bgCanvas.getContext('2d');
  let bgIds = [];        // 背景に描いてある命令の番号の列
  let lastKeep = 0;      // 直近のコマで、前のコマと先頭から一致していた数

  function commonPrefix(a, b) {
    const n = Math.min(a.length, b.length);
    let i = 0;
    while (i < n && a[i] === b[i]) i++;
    return i;
  }

  function paint() {
    // 背景として使える長さ。前のコマと一致していた先頭部分を背景にする。
    // 今の背景がそのまま使えるならそれを使い、背景の途中が変わったとき
    // (まれ)と、背景がずっと短いままのときだけ描き直す。
    const same = commonPrefix(seq, bgIds);
    let bgLen = bgIds.length;
    if (same < bgIds.length || !bgIds.length || lastKeep > bgIds.length + 40) {
      bgLen = Math.min(lastKeep || same, seq.length);
      if (meRange) bgLen = Math.min(bgLen, meRange[0]);
      if (bgCanvas.width !== gameCv.width) bgCanvas.width = gameCv.width;
      if (bgCanvas.height !== gameCv.height) bgCanvas.height = gameCv.height;
      bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      drawRange(bgCtx, bgCanvas, 0, bgLen);
      bgIds = seq.slice(0, bgLen);
    }
    const c = gameCtx;
    c.imageSmoothingEnabled = false;
    c.drawImage(bgCanvas, 0, 0);

    // 自分のキャラは先読みした位置に、相手は届いた位置に描く。どちらも
    // 1手ぶんの時間をかけて隣のマスへ滑らせる(見た目だけの連続移動)。
    // 自分のキャラの絵を、先読みした向きのものに差し替える
    paintSwap = null;
    if (meRange && predFacing && meFacing
        && (predFacing[0] !== meFacing[0] || predFacing[1] !== meFacing[1])) {
      const e = defs.get(seq[meRange[0]]);
      if (e && e[0] === 'I' && /^agent-/.test(e[1])) {
        paintSwap = { idx: meRange[0], name: facingSprite(e[1], predFacing) };
      }
    }

    const segs = [];
    const meAnim = animOffset('me');
    const otherAnim = animOffset('other');
    if (meRange) {
      segs.push({
        from: meRange[0], to: meRange[1],
        dx: (predPos && mePos ? predPos[0] - mePos[0] : 0) + meAnim[0],
        dy: (predPos && mePos ? predPos[1] - mePos[1] : 0) + meAnim[1],
        skip: meMark,
      });
    }
    if (otherRange) {
      segs.push({ from: otherRange[0], to: otherRange[1],
                  dx: otherAnim[0], dy: otherAnim[1], mark: null });
    }
    segs.sort((a, b) => a.from - b.from);

    let cursor = bgLen;
    for (const g of segs) {
      const from = Math.max(cursor, g.from), to = Math.max(cursor, g.to);
      if (from > cursor) drawRange(c, gameCv, cursor, from);
      if (to > from) {
        if (g.dx || g.dy) {
          c.save();
          c.translate(g.dx * tilePx, g.dy * tilePx);
          drawRange(c, gameCv, from, to, g.skip);
          c.restore();
        } else {
          drawRange(c, gameCv, from, to, g.skip);
        }
      }
      cursor = to;
    }
    if (cursor < seq.length) drawRange(c, gameCv, cursor, seq.length);

    // 向いている先の枠は、先読みした向きで描き直す(押した瞬間に変わる)
    if (meRange && meMark !== null && predPos && predFacing) {
      const mx = (predPos[0] + predFacing[0] + meAnim[0]) * tilePx;
      const my = (predPos[1] + predFacing[1] + meAnim[1]) * tilePx;
      c.strokeStyle = 'rgb(60,130,200)';
      c.lineWidth = 2;
      c.strokeRect(mx + 2, my + 2, tilePx - 4, tilePx - 4);
    }
  }

  // 確認用: 描画にかかる時間を開発者ツールから測れるようにする
  window.__overcooked = {
    // 先読みの様子(確認用)
    predict() {
      return { server: mePos, pred: predPos, pending: pendingInputs.length,
               sent: sentInputs, queued: keyQueue.length, range: meRange,
               facing: meFacing, predFacing, swap: paintSwap };
    },
    // 見た目の確認用。アンケート画面をそのまま出す(送信もできる)。
    showSurvey(exp, result) {
      showSurvey(exp || { participant_id: 'test', session: 1, sessions_total: 6,
                          map: 'exp_partition', skip_budget: 0, case: 0 },
                 result || { served: 3, failed: 0, reward: 45, makespan_s: 42.0 },
                 '<div class="sub">提供 3 件 / 失敗 0 件<br>スコア 45</div>');
    },
    benchPaint(n = 100) {
      const t0 = performance.now();
      for (let i = 0; i < n; i++) paint();
      return (performance.now() - t0) / n;
    },
    benchFull(n = 100) {
      const t0 = performance.now();
      for (let i = 0; i < n; i++) drawRange(gameCtx, gameCv, 0, seq.length);
      return (performance.now() - t0) / n;
    },
    sizes: () => ({ total: seq.length, background: bgIds.length }),
  };

  function drawRange(c, cv, from, to, skip) {
    c.imageSmoothingEnabled = false;   // ドット絵をぼかさない(pygame と同じ)
    for (let k = from; k < to; k++) {
      if (k === skip) continue;
      const e = defs.get(seq[k]);
      if (!e) continue;
      switch (e[0]) {
        case 'F':   // ['F', r, g, b]
          c.fillStyle = rgb(e, 1);
          c.fillRect(0, 0, cv.width, cv.height);
          break;
        case 'R': { // ['R', r, g, b, x, y, w, h, 線幅]
          const lw = e[8];
          if (lw > 0) {
            // pygame の枠線は四角の内側に引かれる
            c.strokeStyle = rgb(e, 1);
            c.lineWidth = lw;
            c.strokeRect(e[4] + lw / 2, e[5] + lw / 2, e[6] - lw, e[7] - lw);
          } else {
            c.fillStyle = rgb(e, 1);
            c.fillRect(e[4], e[5], e[6], e[7]);
          }
          break;
        }
        case 'I': { // ['I', 絵の名前, x, y, w, h]
          // 自分のキャラの絵だけは、先読みした向きの絵に差し替える
          // (向きが変わるのも、通信を待たずにその場で見えるように)。
          const im = sprite(paintSwap && k === paintSwap.idx ? paintSwap.name : e[1]);
          if (im.complete && im.naturalWidth) c.drawImage(im, e[2], e[3], e[4], e[5]);
          break;
        }
        case 'T':   // ['T', 文字, r, g, b, x, y, 大きさ]
          c.fillStyle = rgb(e, 2);
          c.font = `${e[7]}px Times, "Times New Roman", serif`;
          c.textBaseline = 'top';
          c.fillText(e[1], e[5], e[6]);
          break;
      }
    }
  }

  // ゲームで使う絵を、ページを開いた時点で全部読み込んでおく。初めて
  // 使う瞬間に読み込むと、スマホでは最初の数秒、描けていない物がある
  // 状態でゲームが進んでいた。読み終わるまでスタートは押せない。
  let spriteTotal = 0, spriteDone = 0, spriteBytes = 0;
  let spritesAllLoaded = false;
  const spriteWaiters = [];
  function onSpriteSettled() {
    spriteDone += 1;
    // 全部そろったかを先に決めてから表示を更新する。逆順だと、最後の1枚で
    // 「110/110」と出たまま押せない状態で止まっていた。
    if (spriteDone >= spriteTotal && !spritesAllLoaded) {
      spritesAllLoaded = true;
      spriteWaiters.splice(0).forEach((f) => f());
    }
    updateStartButton();
  }
  function whenSpritesLoaded(f) { if (spritesAllLoaded) f(); else spriteWaiters.push(f); }
  fetch('/api/sprites').then(r => r.json()).then((d) => {
    setGfxVersion(d.version);
    spriteTotal = d.names.length;
    spriteBytes = d.total_bytes || 0;
    if (!spriteTotal) { spritesAllLoaded = true; updateStartButton(); return; }
    d.names.forEach((name) => {
      const im = sprite(name);
      if (im.complete && im.naturalWidth) { onSpriteSettled(); return; }
      im.addEventListener('load', onSpriteSettled, { once: true });
      im.addEventListener('error', onSpriteSettled, { once: true });
    });
  }).catch(() => { spritesAllLoaded = true; updateStartButton(); });

  function formatBytes(n) {
    if (!n) return '';
    return n >= 1024 * 1024 ? `${(n / 1024 / 1024).toFixed(1)}MB` : `${Math.round(n / 1024)}KB`;
  }
  function updateStartButton() {
    const b = document.getElementById('start');
    if (b) {
      b.disabled = !spritesAllLoaded;
      // 画面ごとに呼び名が違う(チュートリアルは「はじめる」)。
      // 読み込みが終わったら、その画面の呼び名に戻す。
      b.textContent = spritesAllLoaded ? (b.dataset.label || 'スタート')
        : `画像を読み込み中 ${spriteDone}/${spriteTotal || '?'}`;
    }
    const note = document.getElementById('dl-note');
    if (note) {
      const size = formatBytes(spriteBytes);
      note.textContent = spritesAllLoaded
        ? (size ? `ゲームの画像を読み込みました(${size})` : '')
        : `ゲームの画像を読み込んでいます${size ? `(全部で約 ${size})` : ''}`;
    }
  }

  // 最初の盤面を描き終えたか(カウントダウンはその後に始める)
  let boardDrawn = false;
  const boardWaiters = [];
  function markBoardDrawn(force) {
    if (boardDrawn || (!seq.length && !force)) return;
    boardDrawn = true;
    boardWaiters.splice(0).forEach((f) => f());
  }
  function whenBoardDrawn(f) { if (boardDrawn) f(); else boardWaiters.push(f); }

  function onDraw(msg) {
    if (msg.reset) { defs.clear(); seq = []; }
    for (const k in msg.defs) defs.set(+k, msg.defs[k]);
    // 先頭 keep 個(ほとんど動かない背景)は前のコマと同じ。残りだけ届く。
    seq = seq.slice(0, msg.keep).concat(msg.tail);
    lastKeep = msg.keep;
    if (msg.n) pendingAck = msg.n;
    applyMe(msg.me);
    recvTimes.push(performance.now());
    el.fps.textContent = rate(recvTimes);
    schedulePaint();
  }

  // 届いた盤面は、画面の書き換え1回ぶんにまとめて描く。端末の処理が
  // 追いつかないとき、古い盤面を順に描いて遅れが溜まっていくのを防ぐ。
  // 描くのにかかった時間はサーバーへ報告する(遅さの切り分け用)。
  // ---- 自分のキャラの先読み ---------------------------------------------
  // 押した瞬間に端末側で1マス動かして見せ、サーバーから届いた位置で
  // 合わせ直す。こうすると、通信が遅れても「押してから動くまで」は
  // 遅れない(遅れて見えるのは相手の動きだけになる)。
  let stepMs = 200;             // 1手の長さ(サーバーから届く入力の速さで決まる)
  const MAX_QUEUE = 3;          // 押しすぎた分は捨てる(サーバー側と同じ)
  const DIRS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
  const INTERACT_CODE = 'Space';
  let grid = null;              // 通れるマス('.' が通れる)
  let tilePx = 40;
  let mePos = null;             // サーバーが知らせてきた自分の位置
  let meFacing = [0, 1];
  let otherPos = null;
  let predPos = null;           // 先読みした自分の位置
  let predFacing = [0, 1];      // 先読みした向き
  let meRange = null;           // 自分のキャラを描く命令の範囲
  let meMark = null;            // そのうち「向いている先の枠」の位置
  let otherRange = null;        // 相手(AI)のキャラの範囲
  // 見た目だけの移動アニメ。マス目の仕組みは変えず、1手ぶんの時間をかけて
  // 隣のマスへ滑らせる(一瞬で飛ぶと目で追えないため)。
  const anim = { me: null, other: null };
  function startAnim(which, from, to) {
    if (!from || !to || (from[0] === to[0] && from[1] === to[1])) return;
    anim[which] = { dx: from[0] - to[0], dy: from[1] - to[1], t0: performance.now() };
  }
  function animOffset(which) {
    const a = anim[which];
    if (!a) return [0, 0];
    const p = (performance.now() - a.t0) / stepMs;
    if (p >= 1) { anim[which] = null; return [0, 0]; }
    const k = 1 - p;
    return [a.dx * k, a.dy * k];
  }
  let sentInputs = 0;           // 送ったキーの数
  const pendingInputs = [];     // まだサーバーが処理していないキー
  const keyQueue = [];          // これから送るキー(1秒に10個まで)
  let lastSendAt = 0;

  function walkable(x, y) {
    if (!grid) return false;
    const row = grid[y];
    return !!row && row[x] === '.';
  }
  function replayPending(from, facing) {
    // サーバーの位置から、まだ届いていない操作を順に当てはめる。
    // 台の方を向いただけの操作(進めない方向)も、向きだけは反映する。
    let [x, y] = from;
    let f = facing ? facing.slice() : [0, 1];
    for (const d of pendingInputs) {
      if (d === INTERACT_CODE) continue;     // 手を出す操作は位置も向きも変えない
      f = d;
      const nx = x + d[0], ny = y + d[1];
      if (walkable(nx, ny) && !(otherPos && nx === otherPos[0] && ny === otherPos[1])) {
        x = nx; y = ny;
      }
    }
    return [[x, y], f];
  }
  function applyMe(me) {
    if (!me || !me.pos) { meRange = null; otherRange = null; return; }
    const prevOther = otherPos;
    mePos = me.pos;
    meFacing = me.facing || meFacing;
    otherPos = me.other || null;
    meRange = me.range || null;
    meMark = (me.mark === null || me.mark === undefined) ? null : me.mark;
    otherRange = me.other_range || null;
    // 相手(AI)の動きは、届いた位置の間を滑らせて見せる
    startAnim('other', prevOther, otherPos);
    // サーバーが処理した分は、先読みの控えから消す
    const unhandled = Math.max(0, sentInputs - (me.done || 0));
    if (pendingInputs.length > unhandled) {
      pendingInputs.splice(0, pendingInputs.length - unhandled);
    }
    const before = predPos;
    const out = replayPending(mePos, meFacing);
    predPos = out[0];
    predFacing = out[1];
    // 先読みが外れて位置が変わったときも、飛ばずに滑らせる
    if (before && (before[0] !== predPos[0] || before[1] !== predPos[1])) {
      startAnim('me', before, predPos);
    }
  }
  function pushKey(code) {
    // 指示を選んでいる間、ゲームは止まっている。ここで移動や「使う」を
    // 送ると、端末側だけが先読みで動いて見え、決定した瞬間にサーバーの
    // 位置へ引き戻される(「指示中に動いた分だけ戻る」)。動かさないのが
    // 正しい見え方なので、指示中は受け付けない。
    if (inputBlocked() && (DIRS[code] || code === INTERACT_CODE)) return;
    // 移動と「手を出す」は、1手ぶんの間隔で送る(サーバーの受け口も同じ
    // 速さでしか処理しないので、そろえておくとズレない)。それ以外の
    // キー(指示パネル等)はそのまま送る。
    if (!DIRS[code] && code !== INTERACT_CODE) { sendNow({ type: 'key', code }); return; }
    // 同じ入力を溜めすぎない。向きを変える操作は、待っている「使う」より
    // 先に通す(「使う」を押しっぱなしにしていると、方向がいつまでも
    // 届かず向きを変えられなかった)。
    if (keyQueue.filter((c) => c === code).length >= 2) return;
    if (DIRS[code]) {
      const i = keyQueue.findIndex((c) => !DIRS[c]);
      if (i >= 0) keyQueue.splice(i, 0, code);
      else if (keyQueue.length < MAX_QUEUE) keyQueue.push(code);
      else return;
    } else {
      if (keyQueue.length >= MAX_QUEUE) return;
      keyQueue.push(code);
    }
    flushKeys();
  }
  function flushKeys() {
    if (!keyQueue.length) return;
    const now = performance.now();
    if (now - lastSendAt < stepMs) {
      setTimeout(flushKeys, stepMs - (now - lastSendAt));
      return;
    }
    lastSendAt = now;
    const code = keyQueue.shift();
    const upAfter = pendingUp.has(code) && !keyQueue.includes(code);
    if (predPos && grid) {
      const before = predPos;
      pendingInputs.push(DIRS[code] || INTERACT_CODE);
      const out = replayPending(mePos || predPos, meFacing);
      predPos = out[0];
      predFacing = out[1];
      startAnim('me', before, predPos);
      schedulePaint();
    }
    sendNow({ type: 'key', code });
    sentInputs += 1;
    if (upAfter) {
      // 残していた1つを送り終えたので、ここで「離した」を伝える。
      pendingUp.delete(code);
      sendNow({ type: 'key', code, up: true });
    }
    if (keyQueue.length) setTimeout(flushKeys, stepMs);
  }

  // 長押しで歩き続ける。離すまで 1手ぶんの間隔で送る。
  const held = new Set();
  // 「離した」を伝えるのを待っている入力。まだ送っていない分を送り終えて
  // から伝える(先に伝えると、あとから届く1つが新しい長押しの1手目と
  // 見なされてしまう)。
  const pendingUp = new Set();
  let holdTimer = null;
  // 指示を選んでいる間、ゲームは止まっている。ここで動かすと端末側だけが
  // 先読みで進み、決めた瞬間にサーバーの位置へ引き戻される。「決定」を
  // 押してからも、それがサーバーへ届いてゲームが動き出すまでの間は
  // 同じことが起きるので、1手ぶんだけ余分に止めておく。
  let moveBlockUntil = 0;
  function inputBlocked() {
    return instructShown || performance.now() < moveBlockUntil;
  }
  function holdStart(code) {
    if (inputBlocked()) return;   // 指示を選んでいる間は動かない
    if (held.has(code)) return;
    held.add(code);
    pushKey(code);
    if (holdTimer === null) holdTimer = setInterval(holdTick, Math.max(30, stepMs / 2));
  }
  function holdTick() {
    if (!held.size) { clearInterval(holdTimer); holdTimer = null; return; }
    if (performance.now() - lastSendAt < stepMs) return;
    // 複数押しているときは、最後に押した方向へ進む
    const code = [...held][held.size - 1];
    if (keyQueue.length === 0) pushKey(code);
  }
  function holdEnd(code) {
    if (!held.delete(code)) return;
    // 離したら、まだ送っていない同じ入力は 1つだけ残して捨てる。
    // 全部捨てると、軽くたたいただけのときに何も起きない(押した直後に
    // 離すと、まだ送る前なので消えてしまう)。全部残すと、離しても
    // 数マス進み続けて行き過ぎる。
    let kept = false;
    for (let i = 0; i < keyQueue.length; ) {
      if (keyQueue[i] !== code) { i += 1; continue; }
      if (!kept) { kept = true; i += 1; continue; }
      keyQueue.splice(i, 1);
    }
    // 離したことをサーバーにも伝える。長押しの間に「置く/取る」を何度も
    // 繰り返さないよう、ゲーム側が押しっぱなしかどうかを見ている。
    //
    // ただし、まだ送っていない同じ入力が1つ残っているときは、それを
    // 送り終えてから伝える。先に「離した」を伝えると、あとから届く1つが
    // 「新しい長押しの1手目」と見なされ、切って取ったばかりの材料を
    // その場に置いてしまう(実測: 長押しで切り終えたあと、指を離すと
    // 材料が台に戻った)。
    if (code === INTERACT_CODE) {
      if (keyQueue.includes(code)) pendingUp.add(code);
      else sendNow({ type: 'key', code, up: true });
    }
  }

  let paintSwap = null;         // 差し替える絵 {idx, name}
  const FACE_NAMES = { '0,1': 'front', '0,-1': 'back', '1,0': 'right', '-1,0': 'left' };
  function facingSprite(name, facing) {
    const dir = FACE_NAMES[facing.join(',')];
    if (!dir) return name;
    return name.replace(/-(front|back|left|right)$/, '') + '-' + dir;
  }

  let paintQueued = false;
  const paintMs = [];
  let pendingAck = 0;     // 描き終えたらサーバーに返す盤面の番号
  function schedulePaint() {
    if (paintQueued) return;
    paintQueued = true;
    let done = false;
    const run = () => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      paintQueued = false;
      const t0 = performance.now();
      paint();
      paintMs.push(performance.now() - t0);
      if (paintMs.length > 50) paintMs.shift();
      markBoardDrawn();
      // 描き終えたことを伝える。サーバーはこの返事が来るまで、次の盤面を
      // 先に送りすぎない(遅れが溜まらないようにするため)。
      if (pendingAck) { sendNow({ type: 'ack', n: pendingAck }); pendingAck = 0; }
      // 滑らせている途中は、盤面が届かなくても描き続ける
      if (anim.me || anim.other) schedulePaint();
    };
    // 画面の書き換えに合わせて描く。省電力などで書き換えが止まっている
    // 端末では、これが呼ばれないまま固まってしまう(返事も返らず盤面が
    // 届かなくなる)ので、少し待っても来なければ自分で描く。
    const timer = setTimeout(run, 250);
    requestAnimationFrame(run);
  }

  // ---- 接続 ------------------------------------------------------------
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.binaryType = 'blob';
  let lastRtt = null;

  ws.onopen = () => {
    el.conn.textContent = '接続済み';
    el.dot.classList.add('on');
    const nc = navigator.connection || {};
    send({ type: 'hello', mode: MODE,
           net: { type: nc.type || null, effective: nc.effectiveType || null,
                  downlink: nc.downlink || null, rtt: nc.rtt || null } });
    setInterval(() => {
      // 直前に測った往復時間も一緒に送る。サーバー側で、参加者が実際に
      // どれだけ待たされているかを記録するため。
      const avgPaint = paintMs.length ? paintMs.reduce((a, b) => a + b, 0) / paintMs.length : null;
      const pm = document.getElementById('paintms');
      if (pm && avgPaint != null) pm.textContent = avgPaint.toFixed(1);
      send({ type: 'ping', t: performance.now(), rtt: lastRtt,
             paint_ms: avgPaint, recv_fps: Number(rate(recvTimes)),
             defs: defs.size, seq: seq.length });
    }, 1000);
  };

  // 結果表示や順番待ちの表示を出したあとは、切断の案内で上書きしない。
  let settled = false;
  let started = false;

  ws.onclose = () => {
    el.conn.textContent = '切断されました';
    el.dot.classList.remove('on');
    if (settled) return;
    playing = false;
    el.overlay.classList.remove('countdown');
    // 実験のセッションなら、黙ってやり直す。打ち切られた回はセッション数に
    // 数えないので、同じ条件をもう一度遊ぶだけでよい。端末が Wi-Fi と
    // モバイル回線を切り替えるとここに来ることがあり(実測: 途中で接続元の
    // アドレスが変わって切れた)、そのたびにボタンを押させるのは負担が大きい。
    if (sessionExp && retryCount() < 3) {
      noteRetry(retryCount() + 1);
      try { sessionStorage.setItem(AUTOSTART_STORE, '1'); } catch (e) {}
      showOverlay('<div class="big">接続が切れました</div>' +
                  '<div class="sub">この回は数えません。<br>' +
                  '同じ条件でやり直します...</div>');
      setTimeout(() => location.reload(), 2000);
      return;
    }
    // 途中で切れたゲームは続けられない(サーバー側で打ち切られる)。
    showOverlay('<div class="big">接続が切れました</div>' +
                (started || countdownStarted
                  ? '<div class="sub">このゲームは終了しました。<br>最初からやり直してください。</div>'
                  : '') +
                '<button onclick="location.reload()">最初からやり直す</button>');
  };

  // ---- ステージ選択 ----------------------------------------------------
  // 地図・レシピ・注文の組み合わせを選んでからスタートする。前回選んだ
  // ものはこの端末に覚えておく(次に開いたとき同じ選択から始められる)。
  const SKIP_BUDGETS = [0, 1, 2];
  const SKIP_BUDGET_DESC = {
    '0': '0 = 指示したことにすぐ取りかかる',
    '1': '1 = 他の作業を1つまで先にやってから取りかかる',
    '2': '2 = 他の作業を2つまで先にやってから取りかかる',
  };
  const INSTRUCTION_CHOICES = [
    { id: 'once_at_start', label: '指示あり(最初に1回)',
      desc: '始まってすぐ、AIに何をしてほしいかを1つ選びます' },
    { id: 'every_n_tasks', label: 'n回ごとに指示',
      desc: '始まってすぐ1回、そのあとはAIが作業をn個終えるたびに選び直します' },
    { id: 'no_instruction', label: '指示なし',
      desc: 'AIは自分で段取りを決めて動きます' },
  ];
  const PICK_STORE = 'overcooked-stage-v1';
  const PID_STORE = 'overcooked-participant';
  // アンケートを出し終えて読み込み直したときだけ立つ目印。実験のセッションを
  // 続けて回すために、ステージ選択を出さずにそのまま次を始める。
  // タブを閉じるまでしか残らないので、あとで普通に開き直したときは効かない。
  const AUTOSTART_STORE = 'overcooked-autostart';
  // 目印は「実際に次を始める」ところまで消さない。順番待ちに入ると
  // 一度空いたところで読み込み直すので、読み込み時に消してしまうと
  // そこで自動再開が途切れてステージ選択に戻ってしまう。
  function autoStartPending() {
    try { return sessionStorage.getItem(AUTOSTART_STORE) === '1'; }
    catch (e) { return false; }
  }
  function clearAutoStart() {
    try { sessionStorage.removeItem(AUTOSTART_STORE); } catch (e) {}
  }
  // 切れてやり直した回数。つながらないときに読み込み直しを繰り返さないよう、
  // 上限を設けて、それを超えたらボタンを出す。
  const RETRY_STORE = 'overcooked-retry';
  function retryCount() {
    try { return Number(sessionStorage.getItem(RETRY_STORE) || 0) || 0; }
    catch (e) { return 0; }
  }
  function noteRetry(n) {
    try { sessionStorage.setItem(RETRY_STORE, String(n)); } catch (e) {}
  }
  function clearRetry() {
    try { sessionStorage.removeItem(RETRY_STORE); } catch (e) {}
  }
  // 実験の参加者ID。入れて始めると、地図と AI の設定は割り当てどおりになり、
  // 終わったあとにアンケートが出る。空ならこれまでどおり自由に遊べる。
  let participantId = '';
  try { participantId = localStorage.getItem(PID_STORE) || ''; } catch (e) {}
  let assignment = null;      // {session, total, next_map_label, finished}
  function saveParticipant(v) {
    participantId = v.trim();
    try { localStorage.setItem(PID_STORE, participantId); } catch (e) {}
  }
  function loadAssignment() {
    if (!participantId) { assignment = null; renderPick(); return; }
    fetch(`/api/assignment?participant=${encodeURIComponent(participantId)}`
          + `&pattern=${Number(pick.pattern) || 1}`)
      .then(r => r.json())
      .then((a) => { if (a.ok && a.participant_id === participantId) assignment = a; renderPick(); })
      .catch(() => {});
  }
  let options = null;
  // デバッグ用のつまみ。on のときだけサーバーへ送る。実験・練習・
  // チュートリアルには効かない(サーバー側で先に分岐している)。
  const DEBUG_DEFAULT = { on: false, endless: false, seconds: 60,
                          orders_active: 3, cook_seconds: 15, chop_steps: 8 };
  let pick = { map: null, preset: null, case: '', instruction: 'once_at_start',
               skip_budget: 0, instruct_every: 3, pattern: 1,
               debug: Object.assign({}, DEBUG_DEFAULT) };
  try { Object.assign(pick, JSON.parse(localStorage.getItem(PICK_STORE) || '{}')); } catch (e) {}
  const optionsReady = fetch('/api/options').then(r => r.json()).then(o => { options = o; })
    .catch(() => {});

  function esc(t) {
    return String(t).replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'})[c]);
  }

  function renderPick() {
    if (!options) return;
    if (!options.maps.some(m => m.id === pick.map)) pick.map = options.maps[0].id;
    if (!options.recipes.some(r => r.id === pick.preset)) pick.preset = options.recipes[options.recipes.length - 1].id;
    const recipe = options.recipes.find(r => r.id === pick.preset);
    if (pick.case !== '' && !recipe.combos.some(c => String(c.case) === String(pick.case))) pick.case = '';
    const map = options.maps.find(m => m.id === pick.map);

    const btns = (list, key) => list.map(x =>
      `<button type="button" data-key="${key}" data-val="${esc(x.id)}" class="${pick[key] === x.id ? 'on' : ''}">${esc(x.label)}</button>`).join('');
    const combos = ['<option value="">おまかせ(毎回ランダム)</option>']
      .concat(recipe.combos.map(c =>
        `<option value="${c.case}" ${String(pick.case) === String(c.case) ? 'selected' : ''}>${esc(c.label)}</option>`))
      .join('');

    // 実験の参加者は、地図もレシピも選ばない(割り当てどおり)。
    // 練習も条件はくじ引きなので、設定をいじる画面はもう出さない。
    // 動作確認のときだけ ?dev=1 で従来の選択画面を出す。
    // 条件を指定して練習するときは、参加者IDを見ずに全部の選択を出す。
    const custom = (mode === 'custom');
    const experiment = custom ? false : (!!participantId || !DEV);
    const idBox =
      '<div class="pick"><div class="lab">参加者ID(実験のときだけ入れてください)</div>' +
      `<input type="text" id="pid" value="${esc(participantId)}" placeholder="例: p01" ` +
      'autocomplete="off" autocapitalize="off" spellcheck="false">' +
      `<div class="hint">${experiment && assignment
        ? (assignment.finished
            ? `${esc(participantId)} さんは ${assignment.total} セッション全部が終わっています`
            : `${esc(participantId)} さん / セッション ${assignment.session} / ${assignment.total}`)
        : '空のままなら、自由に遊ぶモードです'}</div></div>`;

    showOverlay(
      '<div class="stage-pick">' +
      `<div class="big">${custom ? '条件を指定して練習'
        : (experiment ? 'セッションを始めます' : 'ステージを選んでください')}</div>` +
      (custom ? '<div class="sub">好きな条件で遊べます。記録は残りません。</div>' : idBox) +
      (custom ? '' : patternBlock()) +
      (experiment ? '' :
        `<div class="pick"><div class="lab">地図</div><div class="opts">${btns(options.maps, 'map')}</div>` +
        `<div class="hint">${esc(map.desc)}</div></div>` +
        `<div class="pick"><div class="lab">レシピ</div><div class="opts">${btns(options.recipes, 'preset')}</div>` +
        `<div class="hint">${esc(recipe.desc)}</div></div>` +
        `<div class="pick"><div class="lab">注文の組み合わせ(${recipe.combos.length} 通り)</div>` +
        `<select id="pick-case">${combos}</select></div>` +
        '<div class="pick"><div class="lab">AIへの指示</div><div class="opts">' +
        INSTRUCTION_CHOICES.map((c) =>
          `<button type="button" data-key="instruction" data-val="${c.id}" ` +
          `class="${pick.instruction === c.id ? 'on' : ''}">${esc(c.label)}</button>`).join('') +
        `</div><div class="hint">${esc((INSTRUCTION_CHOICES.find(
            (c) => c.id === pick.instruction) || {}).desc || '')}</div></div>` +
        (pick.instruction === 'every_n_tasks' ?
          '<div class="pick"><div class="lab">何作業ごとに指示するか</div>' +
          '<label class="dbg-row"><span>n</span>' +
          `<input type="number" id="pick-every" value="${Number(pick.instruct_every) || 3}" ` +
          'min="1" max="20" step="1"><em>既定 3</em></label>' +
          '<div class="hint">開始直後に1回、そのあとはn個ごと。' +
          '小さくするほど指示の回数が増えます</div></div>' : '') +
        (pick.instruction !== 'no_instruction' ?
          '<div class="pick"><div class="lab">指示の効き方(AIが先に挟める作業の数)</div>' +
          '<div class="opts">' +
          SKIP_BUDGETS.map((b) =>
            `<button type="button" data-key="skip_budget" data-val="${b}" ` +
            `class="${Number(pick.skip_budget) === b ? 'on' : ''}">${b}</button>`).join('') +
          `</div><div class="hint">${esc(SKIP_BUDGET_DESC[String(pick.skip_budget)] || '')}` +
          '</div></div>' : '')) +
      debugBlock() +
      '<div class="go"><button class="primary" id="start" disabled>スタート</button> ' +
      '<button id="pick-back">最初に戻る</button>' +
      '<div class="sub" id="dl-note" style="margin-top:8px"></div></div>' +
      '</div>');
    document.getElementById('pick-back').addEventListener('click', () => {
      setMode(''); renderModePick();
    });

    const pid = document.getElementById('pid');
    if (pid) {
      const applyPid = () => {
        if (pid.value.trim() === participantId) return;
        saveParticipant(pid.value);
        loadAssignment();
      };
      pid.addEventListener('change', applyPid);
      pid.addEventListener('blur', applyPid);
    }

    el.overlayText.querySelectorAll('.opts button').forEach((b) => b.addEventListener('click', () => {
      pick[b.dataset.key] = (b.dataset.key === 'skip_budget'
                             || b.dataset.key === 'pattern')
        ? Number(b.dataset.val) : b.dataset.val;
      if (b.dataset.key === 'pattern') { assignment = null; loadAssignment(); }
      if (b.dataset.key === 'preset') pick.case = '';
      savePick();
      renderPick();
    }));
    if (!experiment) {
      document.getElementById('pick-case').addEventListener('change', (e) => {
        pick.case = e.target.value;
        savePick();
      });
      const every = document.getElementById('pick-every');
      if (every) every.addEventListener('change', () => {
        pick.instruct_every = Math.max(1, Math.min(20, Number(every.value) || 3));
        savePick();
      });
    }
    wireDebug();
    updateStartButton();
    document.getElementById('start').addEventListener('click', () => {
      if (!spritesAllLoaded) return;
      const pidEl = document.getElementById('pid');
      if (pidEl) saveParticipant(pidEl.value);
      const d = pick.debug || {};
      send({ type: 'start', map: pick.map, preset: pick.preset,
             case: pick.case === '' ? null : Number(pick.case),
             instruction: pick.instruction,
             skip_budget: Number(pick.skip_budget) || 0,
             instruct_every: Number(pick.instruct_every) || 3,
             pattern: Number(pick.pattern) || 1,
             debug: d.on ? {
               endless: !!d.endless,
               seconds: Number(d.seconds) || 60,
               orders_active: Number(d.orders_active) || 3,
               cook_seconds: Number(d.cook_seconds) || 15,
               chop_steps: Number(d.chop_steps) || 8,
             } : null,
             participant: custom ? null : (participantId || null) });
      showOverlay('<div class="big">準備しています</div><div class="sub">数秒かかります</div>');
    });
  }
  function patternBlock() {
    const list = (options && options.patterns) || [];
    if (!list.length) return '';
    const cur = Number(pick.pattern) || 1;
    return '<div class="pick"><div class="lab">実験のパターン</div><div class="opts">' +
      list.map((p) =>
        `<button type="button" data-key="pattern" data-val="${p.id}" ` +
        `class="${cur === p.id ? 'on' : ''}">${esc(p.label)}</button>`).join('') +
      `</div><div class="hint">${esc((list.find((p) => p.id === cur) || {}).desc || '')}` +
      '</div></div>';
  }
  function debugBlock() {
    const d = pick.debug || (pick.debug = Object.assign({}, DEBUG_DEFAULT));
    const num = (key, label, min, max, hint) =>
      '<label class="dbg-row"><span>' + esc(label) + '</span>' +
      `<input type="number" data-dbg="${key}" value="${Number(d[key])}" ` +
      `min="${min}" max="${max}" step="1">` +
      (hint ? `<em>${esc(hint)}</em>` : '') + '</label>';
    return '<details class="dbg"' + (d.on ? ' open' : '') + '>' +
      '<summary>デバッグ設定' + (d.on ? '(有効)' : '') + '</summary>' +
      '<label class="dbg-row"><span>この設定を使う</span>' +
      `<input type="checkbox" data-dbg="on"${d.on ? ' checked' : ''}></label>` +
      '<label class="dbg-row"><span>エンドレス注文</span>' +
      `<input type="checkbox" data-dbg="endless"${d.endless ? ' checked' : ''}>` +
      '<em>片づくたびに9種類から補充。注文の組み合わせの選択は無視されます</em></label>' +
      num('seconds', 'セッション長(秒)', 20, 600, '') +
      num('orders_active', '同時に出す注文数', 1, 5, '') +
      num('cook_seconds', '煮込み時間(秒)', 1, 120, '既定 15') +
      num('chop_steps', '切る回数', 1, 400, '既定 8。5Hz では半分の回数ぶん押す') +
      '<div class="hint">サーバー全体に効くので、複数人が同時に遊ぶと混ざります。' +
      '一人で試すときだけ使ってください。</div>' +
      '<div class="go" style="margin-top:6px"><button type="button" id="dbg-reset">既定に戻す</button></div>' +
      '</details>';
  }
  function wireDebug() {
    const d = pick.debug;
    el.overlayText.querySelectorAll('[data-dbg]').forEach((inp) => {
      inp.addEventListener('change', () => {
        const key = inp.dataset.dbg;
        d[key] = inp.type === 'checkbox' ? inp.checked : Number(inp.value);
        if (key === 'endless' && inp.checked) d.on = true;
        savePick();
        renderPick();
      });
    });
    const rst = document.getElementById('dbg-reset');
    if (rst) rst.addEventListener('click', () => {
      pick.debug = Object.assign({}, DEBUG_DEFAULT);
      savePick();
      renderPick();
    });
  }
  function savePick() {
    try { localStorage.setItem(PICK_STORE, JSON.stringify(pick)); } catch (e) {}
  }

  // 盤面が描けて絵も揃ったら 3・2・1 を出し、終わったら開始の合図を送る。
  // それまでサーバー側の時間は止まっている。
  let countdownStarted = false;
  let countdownRan = false;
  let needInstruction = false;   // この回は最初に指示を選ぶか
  let sessionExp = null;         // 実験のセッションなら、その条件(参加者ID等)
  let reporting = false;         // バグを報告して、やり直しを待っている最中
  let lastSelection = null;
  function selectionNote() {
    // 何を選んだかは、始まる前(カウントダウン中)にだけ見せる。
    // 始まってから出すと盤面が隠れる。
    if (!lastSelection) return '';
    return `<div class="sub" style="margin-top:14px">${esc(lastSelection.map)} / ${esc(lastSelection.preset)}` +
           `<br>${lastSelection.orders.map(esc).join('<br>')}</div>`;
  }
  function startCountdown() {
    if (countdownStarted) return;
    countdownStarted = true;
    // 盤面が描けたことを確かめてから始めるが、何らかの事情で描画が
    // 進まない端末でも止まったままにならないよう、2秒で先へ進める。
    setTimeout(() => markBoardDrawn(true), 2000);
    whenSpritesLoaded(() => whenBoardDrawn(() => {
      paint();
      // 指示を選ぶ回は、選び終えてから数え始める(選んでいる間に
      // 数えると、決めた直後にいきなり始まってしまう)。
      if (needInstruction && !instructDone) {
        hideOverlay();
        return;
      }
      beginCountdown();
    }));
  }

  let countdownTimer = null;
  // 数えるのをやめて、最初からやり直せるようにする。
  function cancelCountdown() {
    if (countdownTimer !== null) { clearTimeout(countdownTimer); countdownTimer = null; }
    countdownRan = false;
    el.overlay.classList.remove('countdown');
  }

  function beginCountdown() {
    if (countdownRan) return;
    countdownRan = true;
    paint();
    let n = 3;
    const tick = () => {
      countdownTimer = null;
      if (n > 0) {
        el.overlay.classList.add('countdown');
        showOverlay(`<div class="cd">${n}</div>` + selectionNote());
        n -= 1;
        countdownTimer = setTimeout(tick, 1000);
      } else {
        send({ type: 'go' });
        showOverlay('<div class="cd">スタート!</div>');
      }
    };
    tick();
  }

  // ---- 最初の選択とチュートリアル ----------------------------------
  // 遊び方は3つ。どれを選んだかと、チュートリアルの何番目まで進んだかは
  // 読み込み直しても残す(途中で画面を閉じても続きから戻れるように)。
  const MODE_STORE = 'overcooked-mode-v1';
  const STEP_STORE = 'overcooked-tutorial-step-v1';
  const DEV = new URLSearchParams(location.search).has('dev');
  let mode = '';
  let tutorialStep = 0;
  try {
    mode = sessionStorage.getItem(MODE_STORE) || '';
    tutorialStep = Number(sessionStorage.getItem(STEP_STORE) || 0) || 0;
  } catch (e) {}
  function setMode(v) {
    mode = v;
    try { sessionStorage.setItem(MODE_STORE, v); } catch (e) {}
  }
  function setStep(n) {
    tutorialStep = n;
    try { sessionStorage.setItem(STEP_STORE, String(n)); } catch (e) {}
  }

  // レシピ表。本家のレシピカードと同じで、材料から提供までを絵で並べる。
  // 絵はゲームで使っているものをそのまま使う(遊び始めて迷わないように)。
  const G = (n) => gfxUrl(n);
  const TUTORIALS = [
    { key: 'salad', title: 'サラダ',
      lead: '切った野菜を皿に乗せて出します。火は使いません。',
      dishes: ['玉ねぎ・トマトのサラダ', 'トマト・レタスのサラダ'],
      steps: [
        [G('FreshOnion'), '材料を取る'],
        [G('cutboard'), 'まな板に置いて、<br>もう一度使うで切る'],
        [G('ChoppedOnion-ChoppedTomato'), '切った材料を<br>重ねる'],
        [G('PlateTile'), '皿置き場で<br>皿に乗せる'],
        [G('delivery'), '提供口へ運ぶ'],
      ] },
    { key: 'soup', title: 'スープ',
      lead: '切った野菜を鍋で煮てから、皿に取って出します。',
      dishes: ['玉ねぎ・レタスのスープ', 'トマト・レタスのスープ'],
      steps: [
        [G('cutboard'), '材料を切る'],
        [G('pot'), '鍋に入れる<br>(2つとも)'],
        [G('CookedLettuce-CookedOnion'), '煮えるまで待つ'],
        [G('PlateTile'), '空の皿を持って<br>鍋から取る'],
        [G('delivery'), '提供口へ運ぶ'],
      ] },
    { key: 'juice', title: 'ジュース',
      lead: '切った果物をミキサーで混ぜ、コップに注いで出します。',
      dishes: ['ブルーベリー・オレンジのジュース', 'バナナ・オレンジのジュース'],
      steps: [
        [G('FreshApple'), '果物を切って、<br>2つ重ねる'],
        [G('blender'), 'ミキサーに入れ、<br>手ぶらで何度も使う'],
        [G('Cup-MixedApple-MixedOrange'), '空のコップを持って<br>ミキサーから注ぐ'],
        [G('delivery'), '提供口へ運ぶ'],
      ] },
    { key: 'ai', title: 'AI と一緒に',
      lead: 'ここからは本番と同じです。AI が相方として一緒に料理します。' +
            '<br>始まる前に、AI にやってほしいことを1つだけ選べます。',
      dishes: ['注文は3つ。サラダ・スープ・ジュースが混ざります'],
      steps: [
        [G('agent-blue-front'), 'あなた'],
        [G('agent-magenta-front'), 'AI'],
        [G('cutboard'), '手分けして作る'],
        [G('delivery'), '3品とも出せたら<br>終わり'],
      ] },
  ];

  function renderModePick() {
    const item = (id, name, why) =>
      `<button type="button" data-mode="${id}">` +
      `<div class="name">${name}</div><div class="why">${why}</div></button>`;
    showOverlay(
      '<div class="stage-pick">' +
      '<div class="big">どれをやりますか</div>' +
      '<div class="modes">' +
      item('tutorial', 'チュートリアル',
           'はじめての人はこちら。サラダ → スープ → ジュースの順に<br>' +
           '1人で作り方を覚えてから、AI と一緒に遊びます。') +
      item('practice', '練習',
           '本番と同じ条件で、好きなだけ練習できます。<br>' +
           '地図も注文も毎回くじ引きです。記録は残りません。') +
      item('custom', '条件を指定して練習',
           '地図・注文・指示の効き方に加えて、煮込み時間や切る回数、<br>' +
           'エンドレス注文なども自分で決めて遊べます。記録は残りません。') +
      item('experiment', '実験に参加',
           '参加者IDを入れて、決められた順番で遊びます。<br>' +
           '1回ごとにアンケートがあります。') +
      '</div></div>');
    el.overlayText.querySelectorAll('.modes button').forEach((b) => {
      b.addEventListener('click', () => {
        setMode(b.dataset.mode);
        if (b.dataset.mode === 'tutorial') { setStep(0); showTutorialCard(); }
        else if (b.dataset.mode === 'practice') startPractice();
        else if (b.dataset.mode === 'custom') {
          // 条件を指定して練習。デバッグ設定は最初から開いた状態にする。
          pick.debug = Object.assign({}, pick.debug || DEBUG_DEFAULT, { on: true });
          savePick();
          showStart();
        } else showStart();
      });
    });
  }

  function showTutorialCard() {
    const t = TUTORIALS[Math.min(tutorialStep, TUTORIALS.length - 1)];
    const steps = t.steps.map(([src, cap]) =>
      `<div class="step"><img src="${src}" alt=""><div class="cap">${cap}</div></div>`)
      .join('<div class="arrow">→</div>');
    showOverlay(
      '<div class="stage-pick">' +
      `<div class="big">${tutorialStep + 1} / ${TUTORIALS.length}　${t.title}</div>` +
      `<div class="sub">${t.lead}</div>` +
      `<div class="recipe">${steps}</div>` +
      `<div class="dishes">${t.dishes.map((d) => '・' + esc(d)).join('<br>')}</div>` +
      '<div class="go"><button class="primary" id="start" data-label="はじめる" ' +
      'disabled>はじめる</button> ' +
      '<button id="tut-quit">やめる</button></div></div>');
    document.getElementById('tut-quit').addEventListener('click', () => {
      setMode(''); renderModePick();
    });
    updateStartButton();
    document.getElementById('start').addEventListener('click', () => {
      if (!spritesAllLoaded) return;
      resetForNewGame();
      send({ type: 'start', mode: 'tutorial', step: tutorialStep });
      showOverlay('<div class="big">準備しています</div><div class="sub">数秒かかります</div>');
    });
  }

  // 1回ぶんの状態を、次のゲームのために戻す。
  //
  // 実験のセッションは毎回ページごと読み込み直すので、この手当てが要らない。
  // チュートリアルと練習は読み込み直さずに次を始めるため、前の回の印が
  // 残っていると先へ進めなくなる(実測: サラダが終わってスープを始めると
  // 「盤面を描いています」のまま固まった。数え始めたかどうかの印が立った
  // ままで、カウントダウンが二度と始まらなかった)。
  function resetForNewGame() {
    settled = false;
    started = false;
    reporting = false;
    playing = false;
    boardDrawn = false;
    boardWaiters.length = 0;
    countdownStarted = false;
    countdownRan = false;
    instructDone = false;
    instructShown = false;
    needInstruction = false;
    hideInstruct();
    cancelCountdown();
  }

  function startPractice() {
    resetForNewGame();
    optionsReady.then(() => whenSpritesLoaded(() => {
      send({ type: 'start', mode: 'practice' });
      showOverlay('<div class="big">準備しています</div><div class="sub">数秒かかります</div>');
    }));
  }

  function showStart() {
    if (!mode && !DEV) { renderModePick(); return; }
    if (mode === 'tutorial') { showTutorialCard(); return; }
    if (mode === 'practice') {
      showOverlay('<div class="stage-pick"><div class="big">練習</div>' +
        '<div class="sub">本番と同じ条件で遊びます。地図も注文も毎回くじ引きです。</div>' +
        '<div class="go"><button class="primary" id="prac-go">はじめる</button> ' +
        '<button id="prac-back">最初に戻る</button></div></div>');
      document.getElementById('prac-go').addEventListener('click', startPractice);
      document.getElementById('prac-back').addEventListener('click', () => {
        setMode(''); renderModePick();
      });
      return;
    }
    if (participantId && !assignment) { loadAssignment(); }
    if (options) { renderPick(); return; }
    showOverlay('<div class="big">読み込み中...</div>');
    optionsReady.then(renderPick);
  }

  ws.onmessage = (ev) => {
    if (typeof ev.data !== 'string') { drawBlob(ev.data); return; }
    const msg = JSON.parse(ev.data);

    if (msg.type === 'draw') {
      onDraw(msg);
    } else if (msg.type === 'meta') {
      applyMeta(msg);
    } else if (msg.type === 'busy') {
      // 別の人がプレイ中。残り時間を見せて待ってもらう。
      settled = true;
      el.conn.textContent = '順番待ち';
      el.state.textContent = '順番待ち';
      let body;
      if (msg.state === 'running' && msg.remaining != null) {
        body = '<div class="sub">終わりしだい、自動で始まります</div>' +
               `<div class="count">${msg.remaining}</div><div class="sub">秒ほどで終わる予定</div>`;
      } else if (msg.state === 'waiting' || msg.state === 'preparing' || msg.state === 'ready') {
        body = '<div class="sub">別の人がステージを選んでいるところです。<br>このままお待ちください。</div>';
      } else {
        body = '<div class="sub">次のゲームを準備しています。<br>このままお待ちください。</div>';
      }
      showOverlay('<div class="big">別の人がプレイ中です</div>' + body);
    } else if (msg.type === 'free') {
      // 空いた。開き直すと、今度はこの端末が操作する側になる。
      settled = true;
      showOverlay('<div class="big">順番が来ました</div><div class="sub">接続しています...</div>');
      setTimeout(() => location.reload(), 500);
    } else if (msg.type === 'kicked') {
      settled = true;
      showOverlay(`<div class="big">${msg.text}</div>` +
                  '<button onclick="location.reload()">もう一度並ぶ</button>');
    } else if (msg.type === 'instruct') {
      showInstruct(msg);
    } else if (msg.type === 'instruct_close') {
      hideInstruct();
    } else if (msg.type === 'notice') {
      showToast(msg.text);
    } else if (msg.type === 'pong') {
      lastRtt = Math.round(performance.now() - msg.t);
      el.rtt.textContent = lastRtt;
    } else if (msg.type === 'status') {
      el.state.textContent = ({
        preparing: '準備中', waiting: '開始待ち', ready: '開始直前', running: 'プレイ中', finished: '終了',
      })[msg.state] || msg.state;
      if (msg.selection) {
        const sel = msg.selection;
        lastSelection = sel;
        needInstruction = sel.instruction === 'once_at_start';
        el.cfg.textContent = `${sel.map} / ${sel.preset} / ${sel.orders.join('、')}`;
      }
      // 実験のセッションかどうかは、始まった時点で決まっている。終わりの
      // 知らせに条件が載っているかで判断すると、載っていない経路を通った
      // ときにアンケートへ進めない(実測: 「もう一度遊ぶ」が出てしまった)。
      // 一度受け取った条件を覚えておき、終わりの判断はこれだけで行う。
      if (msg.experiment && msg.experiment.participant_id) {
        sessionExp = msg.experiment;
      }
      if (msg.state === 'waiting' && !started) {
        if (autoStartPending() && participantId) {
          clearAutoStart();
          showOverlay('<div class="big">次のセッションを準備しています...</div>');
          // 絵が揃ってから送る(揃う前に始めると最初の盤面が描けない)。
          optionsReady.then(() => whenSpritesLoaded(() => {
            send({ type: 'start', participant: participantId,
                   pattern: Number(pick.pattern) || 1 });
          }));
          return;
        }
        showStart();
      } else if (msg.state === 'ready') {
        showOverlay('<div class="big">盤面を描いています...</div>');
        startCountdown();
      } else if (msg.state === 'running') {
        clearRetry();          // 無事に始まったので、やり直しの数は忘れる
        el.overlay.classList.remove('countdown');
        if (!playing) {
          sentInputs = 0;
          pendingInputs.length = 0;
          keyQueue.length = 0;
        }
        playing = true;

        started = true;
        hideOverlay();
      } else if (msg.state === 'finished' && msg.result) {
        // バグの報告でこちらから打ち切ったときは、案内を上書きしない
        if (reporting) return;
        settled = true;
        const summary =
          `<div class="sub">提供 ${msg.result.served} 件 / 失敗 ${msg.result.failed} 件` +
          `<br>スコア ${msg.result.reward}</div>`;
        // 実験のセッション と 自由に遊ぶとき で、終わったあとの進み方が違う。
        //   セッション  : アンケート -> 出し終えたら次のセッションへ
        //   自由に遊ぶ  : 「もう一度遊ぶ」で選び直し
        // 打ち切った回(通信が切れた等)はセッション数に数えないので、
        // アンケートも出さない。
        if (sessionExp && !msg.result.aborted) {
          showSurvey(sessionExp, msg.result, summary);
        } else if (sessionExp) {
          showOverlay('<div class="big">ゲームが途中で終わりました</div>' + summary +
                      '<div class="sub">この回は数えません。もう一度同じ条件で遊びます。</div>' +
                      '<button onclick="location.reload()">やり直す</button>');
        } else if (mode === 'tutorial') {
          showTutorialResult(msg.result, summary);
        } else if (mode === 'practice') {
          showOverlay('<div class="big">練習おしまい</div>' + summary +
                      '<div class="go"><button class="primary" id="again">もう一度練習する</button> ' +
                      '<button id="to-top">最初に戻る</button></div>');
          document.getElementById('again').addEventListener('click', startPractice);
          document.getElementById('to-top').addEventListener('click', () => {
            setMode(''); renderModePick();
          });
        } else {
          showOverlay('<div class="big">ゲーム終了</div>' + summary +
                      '<button onclick="location.reload()">もう一度遊ぶ</button>');
        }
      }
    }
  };

  // チュートリアルの1段階が終わったあと。途中で切れた回は数えず、
  // 同じ段階をもう一度。最後まで行ったら最初の選択へ戻す。
  function showTutorialResult(result, summary) {
    if (result.aborted) {
      showOverlay('<div class="big">途中で終わりました</div>' + summary +
                  '<div class="go"><button class="primary" id="tut-next">' +
                  'もう一度やる</button></div>');
      document.getElementById('tut-next').addEventListener('click', showTutorialCard);
      return;
    }
    const last = tutorialStep >= TUTORIALS.length - 1;
    if (last) {
      setStep(0);
      setMode('');
      showOverlay('<div class="big">チュートリアルは終わりです</div>' + summary +
                  '<div class="sub">おつかれさまでした。<br>' +
                  '続けて練習するか、実験に進んでください。</div>' +
                  '<div class="go"><button class="primary" id="tut-next">' +
                  '最初に戻る</button></div>');
      document.getElementById('tut-next').addEventListener('click', renderModePick);
      return;
    }
    const done = TUTORIALS[tutorialStep].title;
    setStep(tutorialStep + 1);
    showOverlay(`<div class="big">${done}はここまで</div>` + summary +
                '<div class="go"><button class="primary" id="tut-next">' +
                `次へ (${TUTORIALS[tutorialStep].title})</button> ` +
                '<button id="tut-stop">やめる</button></div>');
    document.getElementById('tut-next').addEventListener('click', showTutorialCard);
    document.getElementById('tut-stop').addEventListener('click', () => {
      setMode(''); renderModePick();
    });
  }

  // ---- バグの報告 --------------------------------------------------------
  // 遊んでいる最中に様子がおかしかったら、その場で書いて残してもらう。
  // 書いた内容とそこまでのリプレイをサーバーが保存し、その回は打ち切って
  // 同じ条件でやり直す(打ち切った回はセッション数に数えない)。
  function showBugForm() {
    const wasPlaying = playing;
    playing = false;
    // 書いている間はゲームの時間を止める(残り時間も減らない)。
    sendNow({ type: 'pause', on: true });
    showOverlay(
      '<div class="survey">' +
      '<div class="big">バグを報告</div>' +
      '<div class="sub">書いている間、ゲームは止まっています。<br>' +
      'どこがおかしかったか、覚えている範囲で書いてください。<br>' +
      'そのときの状況は自動で保存されます。</div>' +
      '<div class="q"><textarea id="bug-text" rows="4" ' +
      'placeholder="例: AIがミキサーの前で止まったまま動かなかった"></textarea></div>' +
      '<div class="err" id="bug-err"></div>' +
      '<div class="go">' +
      '<button class="primary" id="bug-send">送信してやり直す</button> ' +
      '<button id="bug-cancel">やめる</button>' +
      '</div></div>');
    document.getElementById('bug-text').focus();

    document.getElementById('bug-cancel').addEventListener('click', () => {
      hideOverlay();
      playing = wasPlaying;
      sendNow({ type: 'pause', on: false });
    });
    document.getElementById('bug-send').addEventListener('click', () => {
      const btn = document.getElementById('bug-send');
      const err = document.getElementById('bug-err');
      btn.disabled = true;
      err.textContent = '送っています...';
      fetch('/api/bug', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: document.getElementById('bug-text').value }),
      }).then(r => r.json()).then((r) => {
        if (!r.ok) throw new Error(r.error || '保存できませんでした');
        settled = true;          // 切断の案内で上書きしない
        reporting = true;        // 終了の知らせでも上書きしない
        showOverlay('<div class="big">ありがとうございました</div>' +
          '<div class="sub">記録しました。<br>同じ条件でやり直します...</div>');
        if (sessionExp) {
          try { sessionStorage.setItem(AUTOSTART_STORE, '1'); } catch (e) {}
        }
        setTimeout(() => location.reload(), 1500);
      }).catch((e) => {
        err.textContent = String(e.message || e);
        btn.disabled = false;
      });
    });
  }

  // ---- アンケート(セッション直後) --------------------------------------
  // パートA: 協調感(5段階・6項目)、パートB: 信頼感(8段階+「あてはまらない」・8項目)。
  // 項目も順番もセッションごとに変えない(順序の影響を一定に保つため)。
  const COORD_ITEMS = ['息が合っていた', '積極的に関わっていた', 'やりとりがスムーズだった',
                       '相手に注意を払っていた', '集中していた', '対等に参加していた'];
  const COORD_LABELS = ['全くそう思わない', 'そう思わない', 'どちらでもない',
                        'そう思う', '強くそう思う'];
  const TRUST_ITEMS = ['信頼できる', '能力がある', '予測できる', '熟練している',
                       '頼りになる', '有能である', '一貫している', '几帳面である'];
  // 自由記述。尺度では拾えない気づきを残すための欄で、回答は任意。
  const FREE_ITEMS = [
    ['free_good', 'AIの動きで「うまく噛み合った」と感じたところがあれば教えてください。'],
    ['free_bad', 'AIの動きで「気になった」「思ったのと違った」ところがあれば教えてください。'],
    ['free_other', 'その他、気づいたことがあれば自由にお書きください。'],
  ];

  function showSurvey(exp, result, summary) {
    playing = false;
    const coordQs = COORD_ITEMS.map((text, i) => {
      const n = i + 1;
      const opts = COORD_LABELS.map((lab, k) =>
        `<label><input type="radio" name="coord_${n}" value="${k + 1}">` +
        `<span>${k + 1}</span>${esc(lab)}</label>`).join('');
      return `<div class="q" id="q-coord_${n}"><div class="text">${n}. ${esc(text)}</div>` +
             `<div class="scale">${opts}</div></div>`;
    }).join('');

    const freeQs = FREE_ITEMS.map(([name, text]) =>
      `<div class="q"><div class="text">${esc(text)}</div>` +
      `<textarea id="${name}" rows="3" placeholder="任意です。空のままでも送信できます"></textarea></div>`
    ).join('');

    const trustQs = TRUST_ITEMS.map((text, i) => {
      const n = i + 1;
      // 0 と 7 だけにラベルを付ける(原版の形式)。数字の下に長い言葉を
      // 入れると縦に伸びるので、両端の言葉は目盛りの下にまとめて置く。
      let opts = '';
      for (let v = 0; v <= 7; v++) {
        opts += `<label><input type="radio" name="trust_${n}" value="${v}">` +
                `<span>${v}</span></label>`;
      }
      return `<div class="q" id="q-trust_${n}"><div class="text">${n}. ${esc(text)}</div>` +
             `<div class="scale num">${opts}</div>` +
             '<div class="anchors"><span>0 = 全くあてはまらない</span>' +
             '<span>7 = 非常にあてはまる</span></div></div>';
    }).join('');

    el.overlay.classList.add('form');
    el.overlay.classList.add('solid');
    document.body.classList.add('survey');
    showOverlay(
      '<div class="survey">' +
      '<div class="big">ゲーム終了</div>' + summary +
      `<div class="sub">セッション ${exp.session} / ${exp.sessions_total}` +
      `(${esc(exp.participant_id)})<br>最後にアンケートにお答えください(1分ほど)。</div>` +
      '<h3>パートA:今回のやりとりについて</h3>' +
      '<div class="lead">今回のやりとりの中で、以下のことがどの程度あったと感じましたか。<br>' +
      '1 = 全くそう思わない 〜 5 = 強くそう思う</div>' + coordQs +
      '<h3>パートB:AIパートナーについて</h3>' +
      '<div class="lead">一緒にプレイしたAIパートナーについて、以下の特性がどの程度あてはまりますか。<br>' +
      '0 = 全くあてはまらない 〜 7 = 非常にあてはまる</div>' + trustQs +
      '<h3>パートC:自由記述(任意)</h3>' +
      '<div class="lead">当てはまるものが無ければ空のままで構いません。</div>' + freeQs +
      '<div class="err" id="sv-err"></div>' +
      '<div class="go"><button class="primary" id="sv-send">送信する</button></div>' +
      '</div>');

    document.getElementById('sv-send').addEventListener('click', () => {
      const err = document.getElementById('sv-err');
      const body = {
        participant_id: exp.participant_id, session: exp.session,
        map: exp.map, skip_budget: exp.skip_budget, case: exp.case,
        served: result.served, makespan_s: result.makespan_s, answered_all: true,
      };
      const missing = [];
      const read = (name) => {
