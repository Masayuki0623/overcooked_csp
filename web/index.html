      '<div class="hint">サーバー全体に効くので、複数人が同時に遊ぶと混ざります。' +
      '一人で試すときだけ使ってください。</div>' +
      '<div class="go" style="margin-top:6px"><button type="button" id="dbg-reset">既定に戻す</button></div>' +
      '</details>';
  }
  function wireDebug() {
    const d = pick.debug;
    el.overlayText.querySelectorAll('[data-dbg]').forEach((inp) => {
      inp.addEventListener('change', () => {
        const key = inp.dataset.dbg;
        d[key] = inp.type === 'checkbox' ? inp.checked : Number(inp.value);
        if (key === 'endless' && inp.checked) d.on = true;
        savePick();
        renderPick();
      });
    });
    const rst = document.getElementById('dbg-reset');
    if (rst) rst.addEventListener('click', () => {
      pick.debug = Object.assign({}, DEBUG_DEFAULT);
      savePick();
      renderPick();
    });
  }
  function savePick() {
    try { localStorage.setItem(PICK_STORE, JSON.stringify(pick)); } catch (e) {}
  }

  // 盤面が描けて絵も揃ったら 3・2・1 を出し、終わったら開始の合図を送る。
  // それまでサーバー側の時間は止まっている。
  let countdownStarted = false;
  let countdownRan = false;
  let needInstruction = false;   // この回は最初に指示を選ぶか
  let sessionExp = null;         // 実験のセッションなら、その条件(参加者ID等)

  // ---- アンケートの下書き ----------------------------------------------
  // ゲームが終わってアンケートを出したあと、画面を閉じる・再読み込みする・
  // 端末が寝る などで回答が消えていた。セッションが済んだ印はゲームの終了
  // 時点で付くので、入り直すと次のセッションへ進んでしまい、その回の
  // アンケートは二度と取れない。書いた端末に残しておいて、次に開いたとき
  // 続きから出せるようにする。
  const SURVEY_DRAFT_STORE = 'overcooked-survey-draft-v2';   // v2: 項目を仕様書(最終版)に変えた
  let surveyChecked = false;     // この表示で一度確かめたか

  function readSurveyAnswers() {
    // 1 問ずつ出すので、答えは画面ではなく入れ物(surveyAnswers)にある
    return Object.assign({}, surveyAnswers || {});
  }

  function saveSurveyDraft(exp, result, summary) {
    if (surveyPreview) return;   // 見た目を確かめているだけのときは残さない
    try {
      localStorage.setItem(SURVEY_DRAFT_STORE, JSON.stringify(
        { exp, result, summary, answers: readSurveyAnswers(), ts: Date.now() }));
    } catch (e) {}
  }

  function clearSurveyDraft() {
    try { localStorage.removeItem(SURVEY_DRAFT_STORE); } catch (e) {}
  }

  // 出し終えていないアンケートが無いか、開いた時点で一度だけ確かめる。
  // 端末の下書きが先。結果が届く前に切れていると下書きは無いので、
  // そのときはサーバーに聞く。
  let surveyGate = null;

  function checkOwedSurvey() {
    if (surveyGate) return surveyGate;
    const draft = readSurveyDraft();
    if (draft || surveyPreview || !participantId) {
      surveyGate = Promise.resolve(draft || null);
      return surveyGate;
    }
    surveyGate = fetch(
      `/api/pending_survey?participant=${encodeURIComponent(participantId)}`)
      .then((r) => r.json())
      .then((r) => ((r && r.ok && r.owed) ? r.owed : null))
      .catch(() => null);
    return surveyGate;
  }

  // 出し忘れがあれば、それを先に片付ける。出したら true。
  function showOwedSurvey(owed) {
    if (!owed || !owed.exp) return false;
    const res = owed.result || {};
    sessionExp = owed.exp;
    settled = true;              // 切断の案内で上書きしない
    showSurvey(owed.exp, res, owed.summary ||
      `<div class="sub">提供 ${res.served} 件 / 失敗 ${res.failed} 件` +
      `<br>スコア ${res.reward}</div>`, owed.answers || null);
    return true;
  }

  // 確かめ終わってから next() へ進む。出し忘れがあればそちらを優先する。
  function afterSurveyCheck(next) {
    if (surveyChecked) { next(); return; }
    surveyChecked = true;
    checkOwedSurvey().then((owed) => { if (!showOwedSurvey(owed)) next(); });
  }

  function readSurveyDraft() {
    try {
      const raw = localStorage.getItem(SURVEY_DRAFT_STORE);
      if (!raw) return null;
      const d = JSON.parse(raw);
      if (!d || !d.exp || !d.exp.participant_id || !d.result) return null;
      // 古い下書きは出さない。同じ端末を次の人が使うことがある。
      if (Date.now() - (d.ts || 0) > 12 * 3600 * 1000) { clearSurveyDraft(); return null; }
      return d;
    } catch (e) { return null; }
  }
  let reporting = false;         // バグを報告して、やり直しを待っている最中
  let lastSelection = null;
  // CSP が立てた計画を画面の端に出す(デバッグの回だけ送られてくる)。
  // 見たいのは「誰が・何を・何番目に・いつからいつまで」。
  // ---- 条件の表示(デバッグのための一時的な表示) --------------------------
  // サーバーが debug_show を付けてきた実験の回だけ、上の帯に条件と指示の
  // 効き方を出す。参加者に遊んでもらうときは、サーバー側で切る。
  let debugCondText = '';
  let debugInsText = '';
  function refreshDebugLine() {
    if (!(sessionExp && sessionExp.debug_show)) return;
    document.body.classList.add('expdebug');
    el.cfg.textContent = debugCondText + (debugInsText ? ' ｜ ' + debugInsText : '');
  }
  function instructionDebugText(ins) {
    const f = (v) => (v === null || v === undefined ? '-' : Number(v).toFixed(1));
    return `指示 ${ins.obj || ''} / 挟んだ数 ${ins.consumed}` +
           `(待ちの中 ${ins.in_wait}) / 残り ${ins.remaining === null || ins.remaining === undefined ? '-' : ins.remaining}` +
           ` / ${ins.status || '-'} / L(d) ${f(ins.L)} / L0 ${f(ins.L0)}` +
           ` (f ${f(ins.f)}→f' ${f(ins.fd)})`;
  }

  function renderPlan(msg) {
    if (msg.instruction) {
      debugInsText = instructionDebugText(msg.instruction);
      refreshDebugLine();
    }
    const box = document.getElementById('plan');
    if (!box) return;
    const rows = (a) => (a.tasks || []).map((t) => {
      const cls = [t.done ? 'done' : (t.now ? 'now' : ''), t.kind || ''].join(' ').trim();
      const f = (v) => (v === null || v === undefined ? '-' : v.toFixed(1));
      return `<tr class="${cls}"><td>${t.n}</td>` +
             `<td class="task">${esc(t.verb)} ${esc(t.obj)}</td>` +
             `<td>${f(t.start)}</td><td>${f(t.end)}</td><td>${f(t.dur)}</td></tr>`;
    }).join('') || '<tr><td colspan="5">（無し）</td></tr>';
    box.innerHTML =
      (msg.instruction
        ? `<div class="now-t">${esc(instructionDebugText(msg.instruction))}</div>` : '') +
      `<div class="now-t">いま ${Number(msg.now).toFixed(1)} 秒　` +
      `<span class="${msg.two_agent ? 'ok' : 'ng'}">` +
      `割り当て: ${msg.two_agent ? '2人で分担' : 'AIが全部やる前提'}</span></div>` +
      (msg.instruction
        ? '<div class="legend"><span class="c">■ 指示した工程</span>　' +
          '<span class="i">■ 指示の前に挟んだ工程</span>　' +
          '<span class="w">■ 煮える待ちの中で挟んだ工程</span>　■ それ以外</div>' : '') +
      (msg.agents || []).map((a) =>
        `<h4>${esc(a.who)}</h4><table>` +
        '<tr><th>順</th><th style="text-align:left">作業</th>' +
        '<th>開始</th><th>終了</th><th>長さ</th></tr>' +
        rows(a) + '</table>').join('');
    box.classList.add('show');
  }

  // 遊んでいる間だけ出す。終わった回の計画を残したままにすると、
  // 次の回が始まったときに古い中身が見えて紛らわしい。
  function hidePlan() {
    const box = document.getElementById('plan');
    if (box) { box.classList.remove('show'); box.innerHTML = ''; }
  }

  function selectionNote() {
    // 何を選んだかは、始まる前(カウントダウン中)にだけ見せる。
    // ただし実験の参加者には見せない。地図の名前・レシピ束・注文の一覧は
    // 動作確認のための情報で、数えている間ずっと盤面の上に薄く重なる。
    // 注文そのものは画面の下に絵で出ているので、字で重ねる必要がない。
    if (!lastSelection || !DEV) return '';
    return `<div class="sub" style="margin-top:14px">${esc(lastSelection.map)} / ${esc(lastSelection.preset)}` +
           `<br>${lastSelection.orders.map(esc).join('<br>')}</div>`;
  }
  function startCountdown() {
    if (countdownStarted) return;
    countdownStarted = true;
    // 盤面が描けたことを確かめてから始めるが、何らかの事情で描画が
    // 進まない端末でも止まったままにならないよう、2秒で先へ進める。
    setTimeout(() => markBoardDrawn(true), 2000);
    whenSpritesLoaded(() => whenBoardDrawn(() => {
      paint();
      // 指示を選ぶ回は、選び終えてから数え始める(選んでいる間に
      // 数えると、決めた直後にいきなり始まってしまう)。
      if (needInstruction && !instructDone) {
        hideOverlay();
        return;
      }
      beginCountdown();
    }));
  }

  let countdownTimer = null;
  // 数えるのをやめて、最初からやり直せるようにする。
  function cancelCountdown() {
    if (countdownTimer !== null) { clearTimeout(countdownTimer); countdownTimer = null; }
    countdownRan = false;
    el.overlay.classList.remove('countdown');
  }

  function beginCountdown() {
    if (countdownRan) return;
    countdownRan = true;
    paint();
    let n = 3;
    const tick = () => {
      countdownTimer = null;
      if (n > 0) {
        el.overlay.classList.add('countdown');
        showOverlay(`<div class="cd">${n}</div>` + selectionNote());
        n -= 1;
        countdownTimer = setTimeout(tick, 1000);
      } else {
        send({ type: 'go' });
        showOverlay('<div class="cd">スタート!</div>');
      }
    };
    tick();
  }

  // ---- 最初の選択とチュートリアル ----------------------------------
  // 遊び方は3つ。どれを選んだかと、チュートリアルの何番目まで進んだかは
  // 読み込み直しても残す(途中で画面を閉じても続きから戻れるように)。
  // チュートリアルを最後までやったか。端末に残す。
  // これが無いと「はじめて参加する」を選べない。操作を覚えていない人が
  // 本番に入ると、条件の差ではなく不慣れの差を測ることになる。
  const TUT_DONE_STORE = 'overcooked-tutorial-done-v1';
  function tutorialDone() {
    try { return localStorage.getItem(TUT_DONE_STORE) === '1'; } catch (e) { return false; }
  }
  function markTutorialDone() {
    try { localStorage.setItem(TUT_DONE_STORE, '1'); } catch (e) {}
  }
  const MODE_STORE = 'overcooked-mode-v1';
  const STEP_STORE = 'overcooked-tutorial-step-v1';
  const DEV = new URLSearchParams(location.search).has('dev');
  let mode = '';
  let tutorialStep = 0;
  try {
    mode = sessionStorage.getItem(MODE_STORE) || '';
    tutorialStep = Number(sessionStorage.getItem(STEP_STORE) || 0) || 0;
  } catch (e) {}
  function setMode(v) {
    mode = v;
    try { sessionStorage.setItem(MODE_STORE, v); } catch (e) {}
  }
  function setStep(n) {
    tutorialStep = n;
    try { sessionStorage.setItem(STEP_STORE, String(n)); } catch (e) {}
  }

  // レシピ表。本家のレシピカードと同じで、材料から提供までを絵で並べる。
  // 絵はゲームで使っているものをそのまま使う(遊び始めて迷わないように)。
  const G = (n) => gfxUrl(n);
  // 何を目指すゲームか。完了時間を効率の指標にするので、「協力して早く
  // 終える」が目的だと全員に伝えておく。
  const GOAL_NOTE = 'AIと二人で協力して、できるだけ早く3品を作り終えてください。';
  // AI についての事前の説明。実験前の質問(A2・A3: AI の能力の予想)に答えて
  // もらったあとに出す。後回しを故障ではなく段取りの結果と受け取れるようにする。
  // 「計算できる」と書く(「常に最善に動く」とは書かない)。
  const AI_NOTE = 'AIは、いちばん早く作り終える段取りを計算できます。' +
                  'ただし、あなたの考えを推し量ることはしません。';
  // チュートリアル(2026-10-07 作り直し)。文は短く、手順は 1 クリックで 1 つずつ。
  // 絵はゲームで使っているものをそのまま使う(遊び始めて迷わないように)。
  //   steps: [[絵の並び, 説明]]。絵の並びは 'A', '→', '+' を並べた配列
  const TUTORIALS = [
    { key: 'salad', title: 'サラダ',
      lead: '切った野菜を皿にのせて出します',
      dishes: ['玉ねぎ・トマトのサラダ', 'トマト・レタスのサラダ'],
      steps: [
        [['agent-blue-front'], '矢印キーで動き、Space で手を出します'],
        [['FreshOnionTile', '→', 'FreshOnion'], '箱から材料を取る'],
        [['cutboard', '→', 'ChoppedOnion'], 'まな板に置いて、何度か手を出して切る'],
        [['ChoppedOnion', '+', 'ChoppedTomato', '→', 'ChoppedOnion-ChoppedTomato'], '切った材料を重ねる'],
        [['plate', '→', 'delivery'], '皿にのせて、提供口へ'],
      ] },
    { key: 'soup', title: 'スープ',
      lead: '切った野菜を鍋で煮てから出します',
      dishes: ['玉ねぎ・レタスのスープ', 'トマト・レタスのスープ'],
      steps: [
        [['ChoppedLettuce', '+', 'ChoppedOnion', '→', 'pot'], '2つ重ねてから、鍋に入れる'],
        [['CookedLettuce-CookedOnion'], '煮えるまで待つ'],
        [['plate', '→', 'pot'], '空の皿を持って、鍋から取る'],
        [['delivery'], '提供口へ'],
      ] },
    { key: 'juice', title: 'ジュース',
      lead: '切った果物をミキサーで混ぜて出します',
      dishes: ['ブルーベリー・オレンジのジュース', 'バナナ・オレンジのジュース'],
      steps: [
        [['ChoppedApple', '+', 'ChoppedOrange', '→', 'blender'], '2つ重ねてから、ミキサーに入れる'],
        [['blender'], '何度か手を出して混ぜる'],
        [['Cup', '→', 'Cup-MixedApple-MixedOrange'], '空のコップを持って注ぐ'],
        [['delivery'], '提供口へ'],
      ] },
    { key: 'ai', title: 'AI と一緒に',
      // この回は指示を出さない(指示ありで遊ぶと、そのときの条件だけ余分に
      // 経験することになる)。本番で指示を求められることは、ここで伝える。
      lead: 'AI が相方として一緒に料理します',
      dishes: ['注文は3つ。サラダとスープが混ざります'],
      steps: [
        [['agent-blue-front', '+', 'agent-magenta-front'], 'あなたと AI の二人で作ります'],
        [[], GOAL_NOTE],
        [[], AI_NOTE],
        [[], '本番では、ゲームの始めに、AI に今すぐやってほしい作業を 1 つ指示します'],
        [[], 'この回は、指示はありません'],
      ] },
  ];
  // 本番の流れの中でやるチュートリアル。実験の注文は野菜だけなので、
  // ジュースは飛ばす。
  const HONBAN_STORE = 'overcooked-honban-v1';
  function inHonban() {
    try { return sessionStorage.getItem(HONBAN_STORE) === '1'; } catch (e) { return false; }
  }
  function setHonban(on) {
    try {
      if (on) sessionStorage.setItem(HONBAN_STORE, '1');
      else sessionStorage.removeItem(HONBAN_STORE);
    } catch (e) {}
  }
  function tutorialOrder() {
    return inHonban() ? [0, 1, 3] : [0, 1, 2, 3];
  }
  function tutorialPos() {
    const order = tutorialOrder();
    const k = order.indexOf(tutorialStep);
    return k < 0 ? 0 : k;
  }

  // ---- 同意と参加者情報 ---------------------------------------------
  // 同意する前は、いかなるデータも記録しない。同意を飛ばす隠し口は作らない。
  // 動作確認のときは ?test=1 を付ける。その回は「テスト実行」として
  // 名簿に印が付き、分析から外せる。
  // 行は配列で持つ。文字列の中に改行の記号を書くと、書き出しのときに
  // 実際の改行に化けて JS が壊れることがある(実際に一度壊した)。
  const CONSENT_TEXT = [
    ['この実験について', [
      'AIと協力して料理を作るゲームをプレイしていただき、',
      '協力のしやすさについてお伺いします。']],
    ['所要時間', [
      '約30分',
      '・操作の練習：約10分',
      '・本番：ゲーム4回（1回あたり1〜2分）と、そのたびの質問']],
    ['データの取り扱い', [
      '・回答は参加者番号で管理し、お名前は分析に使用しません',
      '・研究発表や論文において、個人が特定される形で公表することはありません',
      '・お名前と参加者番号の対応表は、分析終了後に破棄します',
      '・記録するのは、ゲーム中の操作履歴と質問への回答のみです']],
    ['参加は任意です', [
      '・途中でやめたいと思われた場合、いつでも中断できます',
      '・中断・辞退によって不利益を受けることは一切ありません',
      '・中断された場合、それまでのデータは破棄します']],
  ];
  const CONSENT_CHECKS = [
    '上記の説明を読み、内容を理解しました',
    '参加は任意であり、いつでも中断できることを理解しました',
    'データの取り扱いについて理解し、同意します',
    '上記に同意し、実験に参加します',
  ];

  let consentInfo = null;

  function renderResume() {
    showOverlay(
      '<div class="consent">' +
      '<div class="big">続きから</div>' +
      '<div class="c-sec"><div class="c-h">参加者番号</div>' +
      '<div class="c-t">はじめに画面へ出ていた番号です（例: p01）。</div>' +
      '<input type="text" id="rs-id" autocomplete="off" autocapitalize="off" ' +
      // この端末で前に使った番号があれば入れておく(打ち直しの手間と打ち間違いを減らす)。
      `spellcheck="false" placeholder="p01" value="${esc(participantId || '')}"></div>` +
      (participantId ? '<div class="sub">この端末で前に使った番号を入れてあります</div>' : '') +
      '<div class="err" id="rs-err"></div>' +
      '<div class="go"><button class="primary" id="rs-go">続きから始める</button> ' +
      '<button id="rs-back">戻る</button></div></div>');
    document.getElementById('rs-back').addEventListener('click', () => {
      setMode(''); renderModePick();
    });
    document.getElementById('rs-go').addEventListener('click', () => {
      const err = document.getElementById('rs-err');
      const v = (document.getElementById('rs-id').value || '').trim();
      if (!v) { err.textContent = '参加者番号を入れてください'; return; }
      err.textContent = '確かめています...';
      fetch(`/api/resume?participant=${encodeURIComponent(v)}`)
        .then(r => r.json())
        .then((r) => {
          if (!r.ok) throw new Error(r.error || '確かめられませんでした');
          if (r.finished) {
            err.textContent = `${r.participant_id} さんは全${r.total}回を終えています`;
            return;
          }
          saveParticipant(r.participant_id);
          pick.pattern = 3;
          savePick();
          loadAssignment();
          showStart();
        })
        .catch((e) => { err.textContent = String(e.message || e); });
    });
  }

  function showConsent() {
    fetch('/api/consent').then(r => r.json()).then((info) => {
      consentInfo = info;
      renderConsent();
    }).catch(() => { consentInfo = { contact: {}, experience: [], gender: [] }; renderConsent(); });
  }

  // 説明は 1 項目ずつ。「次へ」を押すたびに 1 つ増える。
  function renderConsent() {
    const c = (consentInfo && consentInfo.contact) || {};
    const lines = (a) => a.map(esc).join('<br>');
    const items = CONSENT_TEXT.map(([head, ls]) =>
      `<div class="c-sec"><div class="c-h">${esc(head)}</div>` +
      `<div class="c-t">${lines(ls)}</div></div>`);
    const who = [c.name, c.affiliation, c.email].filter(Boolean).map(esc).join('<br>');
    items.push('<div class="c-sec"><div class="c-h">連絡先</div><div class="c-t">' +
               (who || '実験の担当者にお尋ねください') +
               '<br>ご不明な点がありましたら、いつでもお尋ねください。</div></div>');
    const checks = CONSENT_CHECKS.map((t, i) =>
      `<label class="c-chk"><input type="checkbox" data-i="${i}">` +
      `<span>${esc(t)}</span></label>`).join('');
    revealSteps({
      head: '<div class="big">実験へのご協力のお願い</div>',
      items,
      final: `<div class="c-checks">${checks}</div>` +
             '<div class="err" id="c-err"></div>' +
             '<div class="go"><button class="primary" id="c-go" disabled>同意して進む</button> ' +
             '<button id="c-no">同意しない（終了）</button></div>',
      onReady: (root) => {
        const boxes = [...root.querySelectorAll('.c-chk input')];
        const go = root.querySelector('#c-go');
        const sync = () => { go.disabled = !boxes.every(b => b.checked); };
        boxes.forEach(b => b.addEventListener('change', sync));
        go.addEventListener('click', () => renderProfile(boxes.map(b => b.checked)));
        root.querySelector('#c-no').addEventListener('click', () => {
          // 何も記録せずに終わる。
          setHonban(false);
          showOverlay('<div class="consent"><div class="big">ありがとうございました</div>' +
            '<div class="sub">このまま画面を閉じてください。<br>' +
            'データは記録していません。</div></div>');
        });
      },
    });
  }

  // 参加者情報と、実験前の質問(アンケート仕様書 A)。1 問ずつ出す。
  // A は AI についての説明を読む前に答えてもらう(説明を読んだ後だと、
  // AI の能力の予想が説明の影響を受ける)。
  function renderProfile(agreed) {
    const exps = ((consentInfo && consentInfo.experience) || [])
      .map((x) => [x.id, x.label]);
    const genders = ((consentInfo && consentInfo.gender) || [])
      .map((x) => [x.id, x.label]);
    const steps = [
      { kind: 'info', html: '<div class="big">はじめに</div>' +
        '<div class="sub">あなたについて、いくつか質問します</div>' },
      { kind: 'input', name: 'name', input: 'text', text: 'お名前',
        note: '名簿にのみ記録し、分析には使用しません' },
      { kind: 'input', name: 'age', input: 'number', text: '年齢', optional: true,
        note: '答えなくてもかまいません' },
    ];
    if (genders.length) {
      steps.push({ kind: 'pick', name: 'gender', text: '性別', choices: genders });
    }
    steps.push(
      { kind: 'pick', name: 'game_experience',
        text: '「Overcooked」やそれに似た協力型の料理ゲームを遊んだことがある',
        choices: exps.length ? exps : [['yes', 'はい'], ['no', 'いいえ']] },
      { kind: 'info', html: '<div class="q-text">ここからは、このあと一緒にゲームをする AI について、' +
        'いまの予想を答えてください</div>' },
      { kind: 'five', name: 'ai_expect_plan', ctx: 'AI についての予想',
        text: 'ゲームの相手をする AI は、作業を効率よく進める段取りを立てられると思う' },
      { kind: 'five', name: 'ai_expect_intent', ctx: 'AI についての予想',
        text: 'ゲームの相手をする AI は、人が何をしたいのかを理解できると思う' },
    );
    runQuestions({
      steps, answers: {}, cls: 'survey',
      finishText: 'ありがとうございます。この内容で登録します',
      finishLabel: '登録して進む',
      onFinish: (a, fail) => {
        const isTest = new URLSearchParams(location.search).has('test');
        fetch('/api/consent', { method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ agreed, name: String(a.name || '').trim(),
                                 age: String(a.age || '').trim(),
                                 gender: a.gender || 'na',
                                 game_experience: a.game_experience,
                                 ai_expect_plan: a.ai_expect_plan,
                                 ai_expect_intent: a.ai_expect_intent,
                                 test: isTest }) })
          .then(r => r.json())
          .then((r) => {
            if (!r.ok) throw new Error(r.error || '登録できませんでした');
            saveParticipant(r.participant_id);
            if (r.resumed) {
              // 同じ名前で途中の人。番号を引き継いで続きから(練習は済んでいる)。
              setHonban(false);
              showOverlay('<div class="consent"><div class="big">前回の続きから始めます</div>' +
                `<div class="sub">参加者番号 ${esc(r.participant_id)} / ゲーム ${r.session} / ${r.total}</div></div>`);
              setTimeout(() => { loadAssignment(); showStart(); }, 2200);
              return;
            }
            loadAssignment(!inHonban());
            if (inHonban()) {
              // 本番の流れ: 続けて操作の練習(チュートリアル)へ
              // 先に練習の状態にしておく。ボタンを押す前に読み込み直されると、
              // 練習を飛ばして本番の 1 回目から始まってしまっていた。
              setMode('tutorial'); setStep(0);
              showOverlay('<div class="consent"><div class="big">登録しました</div>' +
                `<div class="sub">参加者番号 ${esc(r.participant_id)}</div>` +
                '<div class="sub">続けて、操作の練習をします</div>' +
                '<div class="go"><button class="primary" id="hb-tut">練習を始める</button></div></div>');
              document.getElementById('hb-tut').addEventListener('click', () => {
                setMode('tutorial'); setStep(0); showTutorialCard();
              });
              return;
            }
            showStart();
          })
          .catch((e) => fail(String(e.message || e)));
      },
    });
  }

  function renderModePick() {
    const item = (id, name, why, off) =>
      `<button type="button" data-mode="${id}"${off ? ' disabled' : ''}>` +
      `<div class="name">${name}</div><div class="why">${why}</div></button>`;
    showOverlay(
      '<div class="stage-pick">' +
      '<div class="big">どれをやりますか</div>' +
      '<div class="modes">' +
      item('tutorial', 'チュートリアル（約5分）',
           'はじめての人はこちら。1人で作り方を覚えてから、<br>' +
           'AI と一緒に遊びます。') +
      // 「新たに始める」は最初から選べる(以前はチュートリアルを終えた
      // 端末でだけ選べるようにしていたが、やめた)。
      item('exp_new', '実験セッションを新たに始める（約20分）',
           'ゲーム4回と質問。はじめに説明と同意があります。') +
      item('exp_resume', '実験セッションを続きから',
           '前に参加した方はこちら。参加者番号を入れると、<br>' +
           '続きのセッションから始まります。') +
      item('custom', 'デバッグ',
           '地図・注文・指示の効き方などを自分で決めて遊べます。<br>' +
           '画面の端に、CSP が立てた AI と人の計画を出します。記録は残りません。') +
      // 練習だけは最初の画面に出さない。本番前にどれだけ練習したかが
      // ばらつくと、条件の比較に混ざる。練習は実験の流れの中で1回だけ。
      (DEV
        ? item('practice', '練習（確認用）',
               '本番と同じ条件で遊びます。記録は残りません。')
        : '') +
      // 実験に参加する人が、最初から最後まで通しでやる流れ(2026-10-07)。
      //   説明・同意 → あなたについての質問 → 操作の練習 → ゲームと質問 × 4 → 終わり
      item('honban', '本番',
           '参加者の方はこちら。説明と同意、操作の練習、<br>' +
           'ゲームと質問を、最初から最後まで通しで行います。') +
      '</div></div>');
    el.overlayText.querySelectorAll('.modes button').forEach((b) => {
      b.addEventListener('click', () => {
        // 選べないものは何もしない。disabled でも押せる環境があるので、
        // ここでも止める。
        if (b.disabled) return;
        setHonban(false);
        setMode(b.dataset.mode);
        if (b.dataset.mode === 'tutorial') { setStep(0); showTutorialCard(); }
        else if (b.dataset.mode === 'practice') startPractice();
        else if (b.dataset.mode === 'custom') {
          // 条件を指定して練習。デバッグ設定は最初から開いた状態にする。
          pick.debug = Object.assign({}, pick.debug || DEBUG_DEFAULT, { on: true });
          savePick();
          showStart();
        } else if (b.dataset.mode === 'exp_new' || b.dataset.mode === 'honban') {
          // 端末に前の人の番号が残っていることがある。捨ててから始める。
          setHonban(b.dataset.mode === 'honban');
          setMode('experiment');
          pick.pattern = 3;
          pick.debug = Object.assign({}, pick.debug || DEBUG_DEFAULT, { on: false });
          savePick();
          saveParticipant('');
          assignment = null;
          showConsent();
        } else if (b.dataset.mode === 'exp_resume') {
          setMode('experiment');
          pick.pattern = 3;
          savePick();
          renderResume();
        } else showStart();
      });
    });
  }

  // 手順の絵の並び。'→' と '+' は記号として出す。
  function tutStepHtml([imgs, cap]) {
    const pics = (imgs || []).map((n) => (n === '→' || n === '+')
      ? `<span class="t-op">${n}</span>`
      : `<img src="${G(n)}" alt="">`).join('');
    return (pics ? `<div class="t-pics">${pics}</div>` : '') +
           `<div class="t-cap">${esc(cap)}</div>`;
  }

  function showTutorialCard() {
    const order = tutorialOrder();
    if (!order.includes(tutorialStep)) setStep(order[0]);
    const t = TUTORIALS[tutorialStep];
    const pos = tutorialPos();
    revealSteps({
      cls: 'tut',
      head: `<div class="t-no">${pos + 1} / ${order.length}</div>` +
            `<div class="big">${esc(t.title)}</div>` +
            `<div class="t-lead">${esc(t.lead)}</div>`,
      items: t.steps.map(tutStepHtml),
      final: `<div class="dishes">${t.dishes.map((d) => esc(d)).join('<br>')}</div>` +
             '<div class="go"><button class="primary" id="start" data-label="はじめる" ' +
             'disabled>はじめる</button>' +
             (inHonban() ? '' : ' <button id="tut-quit">やめる</button>') + '</div>',
      onReady: (root) => {
        const quit = root.querySelector('#tut-quit');
        if (quit) quit.addEventListener('click', () => { setMode(''); renderModePick(); });
        updateStartButton();
        root.querySelector('#start').addEventListener('click', () => {
          if (!spritesAllLoaded) return;
          resetForNewGame();
          send({ type: 'start', mode: 'tutorial', step: tutorialStep });
          showOverlay('<div class="consent"><div class="big">準備しています</div>' +
                      '<div class="sub">数秒かかります</div></div>');
        });
      },
    });
  }

  // 1回ぶんの状態を、次のゲームのために戻す。
  //
  // 実験のセッションは毎回ページごと読み込み直すので、この手当てが要らない。
  // チュートリアルと練習は読み込み直さずに次を始めるため、前の回の印が
  // 残っていると先へ進めなくなる(実測: サラダが終わってスープを始めると
  // 「盤面を描いています」のまま固まった。数え始めたかどうかの印が立った
  // ままで、カウントダウンが二度と始まらなかった)。
  function resetForNewGame() {
    settled = false;
    finishedSeen = false;
    started = false;
    reporting = false;
    playing = false;
    boardDrawn = false;
    boardWaiters.length = 0;
    countdownStarted = false;
    countdownRan = false;
    instructDone = false;
    instructShown = false;
    needInstruction = false;
    hideInstruct();
    showCurrentInstruction('');   // 前の回の指示は消す
    cancelCountdown();
  }

  function startPractice() {
    resetForNewGame();
    optionsReady.then(() => whenSpritesLoaded(() => {
      send({ type: 'start', mode: 'practice' });
      showOverlay('<div class="big">準備しています</div><div class="sub">数秒かかります</div>');
    }));
  }

  function showStart() {
    // アンケートの見た目を確かめているだけのときは、上書きしない。
    if (surveyPreview) return;
    // 前の回のアンケートを出し終えていないなら、それを先に片付ける。
    if (!surveyChecked) { afterSurveyCheck(showStart); return; }
    if (!mode && !DEV) { renderModePick(); return; }
    if (mode === 'tutorial') { showTutorialCard(); return; }
    if (mode === 'practice') {
      showOverlay('<div class="stage-pick"><div class="big">練習</div>' +
        '<div class="sub">本番と同じ条件で遊びます。地図も注文も毎回くじ引きです。</div>' +
        '<div class="go"><button class="primary" id="prac-go">はじめる</button> ' +
        '<button id="prac-back">最初に戻る</button></div></div>');
      document.getElementById('prac-go').addEventListener('click', startPractice);
      document.getElementById('prac-back').addEventListener('click', () => {
        setMode(''); renderModePick();
      });
      return;
    }
    // 実験セッションで参加者番号がまだ無い = 同意がまだ。説明から始める。
    // 番号は自動で採番するので、手で入れる画面は出さない。
    if (mode === 'experiment' && !participantId) { renderModePick(); return; }
    if (participantId && !assignment) { loadAssignment(); }
    if (options) { renderPick(); return; }
    showOverlay('<div class="big">読み込み中...</div>');
    optionsReady.then(renderPick);
  }

  // 順番待ちの状態になったときの続き。アンケートの出し忘れを確かめてから
  // ここへ来る(確かめる前に次のセッションを始めると、前の回のアンケートを
  // 飛ばしてしまう)。
  function onWaiting() {
    if (autoStartPending() && participantId) {
      clearAutoStart();
      showOverlay('<div class="big">次のセッションを準備しています...</div>');
      // 絵が揃ってから送る(揃う前に始めると最初の盤面が描けない)。
      optionsReady.then(() => whenSpritesLoaded(() => {
        send({ type: 'start', participant: participantId,
               pattern: Number(pick.pattern) || 1 });
      }));
      return;
    }
    showStart();
  }

  ws.onmessage = (ev) => {
    if (typeof ev.data !== 'string') { drawBlob(ev.data); return; }
    const msg = JSON.parse(ev.data);

    if (msg.type === 'draw') {
      onDraw(msg);
    } else if (msg.type === 'meta') {
      applyMeta(msg);
    } else if (msg.type === 'busy') {
      // 別の人がプレイ中。残り時間を見せて待ってもらう。
      settled = true;
      el.conn.textContent = '順番待ち';
      el.state.textContent = '順番待ち';
      let body;
      if (msg.state === 'running' && msg.remaining != null) {
        body = '<div class="sub">終わりしだい、自動で始まります</div>' +
               `<div class="count">${msg.remaining}</div><div class="sub">秒ほどで終わる予定</div>`;
      } else if (msg.state === 'waiting' || msg.state === 'preparing' || msg.state === 'ready') {
        body = '<div class="sub">別の人がステージを選んでいるところです。<br>このままお待ちください。</div>';
      } else {
        body = '<div class="sub">次のゲームを準備しています。<br>このままお待ちください。</div>';
      }
      showOverlay('<div class="big">別の人がプレイ中です</div>' + body);
    } else if (msg.type === 'free') {
      // 空いた。開き直すと、今度はこの端末が操作する側になる。
      settled = true;
      showOverlay('<div class="big">順番が来ました</div><div class="sub">接続しています...</div>');
      setTimeout(() => location.reload(), 500);
    } else if (msg.type === 'kicked') {
      settled = true;
      showOverlay(`<div class="big">${msg.text}</div>` +
                  '<button onclick="location.reload()">もう一度並ぶ</button>');
    } else if (msg.type === 'instruct') {
      showInstruct(msg);
    } else if (msg.type === 'instruct_interp') {
      if (instructInterpHandler) instructInterpHandler(msg);
    } else if (msg.type === 'instruct_close') {
      hideInstruct();
    } else if (msg.type === 'plan') {
      renderPlan(msg);
    } else if (msg.type === 'notice') {
      showToast(msg.text);
    } else if (msg.type === 'pong') {
      lastRtt = Math.round(performance.now() - msg.t);
      el.rtt.textContent = lastRtt;
    } else if (msg.type === 'status') {
      el.state.textContent = ({
        preparing: '準備中', waiting: '開始待ち', ready: '開始直前', running: 'プレイ中', finished: '終了',
      })[msg.state] || msg.state;
      if (msg.selection) {
        const sel = msg.selection;
        lastSelection = sel;
        needInstruction = sel.instruction === 'once_at_start';
        // 地図の名前・レシピ束・注文の一覧は、動作確認のための情報。
        // 参加者の画面では上の帯を押し広げるだけで、スマホでは折り返して
        // 「バグを報告」の位置までずれる。?dev=1 のときだけ出す。
        el.cfg.textContent = DEV
          ? `${sel.map} / ${sel.preset} / ${sel.orders.join('、')}` : '';
      }
      // 実験のセッションかどうかは、始まった時点で決まっている。終わりの
      // 知らせに条件が載っているかで判断すると、載っていない経路を通った
      // ときにアンケートへ進めない(実測: 「もう一度遊ぶ」が出てしまった)。
      // 一度受け取った条件を覚えておき、終わりの判断はこれだけで行う。
      if (msg.experiment && msg.experiment.participant_id) {
        sessionExp = msg.experiment;
        if (sessionExp.debug_show) {
          const x = sessionExp;
          // スマホの帯は狭いので短く書く。注文の中身は盤面の下に絵で出ている。
          debugCondText = `【条件】割り込み許容数 d=${x.skip_budget}` +
            ` / ${x.session}回目(全${x.sessions_total}回) / ${x.agent || ''} / ${x.group || ''}` +
            ` / 注文の番号 ${x.case}`;
          refreshDebugLine();
        }
      }
      // 終わった直後は残す(デバッグで見返せるように)。次の回の準備で消す。
      if (msg.state !== 'running' && msg.state !== 'finished') hidePlan();
      if (msg.state === 'waiting' && !started) {
        if (!surveyChecked) {
          afterSurveyCheck(() => { if (!started) onWaiting(); });
          return;
        }
        onWaiting();
        return;
      } else if (msg.state === 'ready') {
        showOverlay('<div class="big">盤面を描いています...</div>');
        startCountdown();
      } else if (msg.state === 'running') {
        finishedSeen = false;  // 次の回が始まった
        clearRetry();          // 無事に始まったので、やり直しの数は忘れる
        el.overlay.classList.remove('countdown');
        if (!playing) {
          sentInputs = 0;
          pendingInputs.length = 0;
          keyQueue.length = 0;
        }
        playing = true;

        started = true;
        hideOverlay();
      } else if (msg.state === 'finished') {
        // 結果がまだ出来ていない1回目の知らせでも、終わったことは確か。
        // ここで覚えておかないと、結果が届く前に切れたときに
        // 「接続が切れました」と出て、遊び終えた回をやり直させてしまう。
        finishedSeen = true;
        if (!msg.result) return;
        // バグの報告でこちらから打ち切ったときは、案内を上書きしない
        if (reporting) return;
        settled = true;
        const summary =
          `<div class="sub">提供 ${msg.result.served} 件 / 失敗 ${msg.result.failed} 件` +
          `<br>スコア ${msg.result.reward}</div>`;
        // 実験のセッション と 自由に遊ぶとき で、終わったあとの進み方が違う。
        //   セッション  : アンケート -> 出し終えたら次のセッションへ
        //   自由に遊ぶ  : 「もう一度遊ぶ」で選び直し
        // 打ち切った回(通信が切れた等)はセッション数に数えないので、
        // アンケートも出さない。
        if (sessionExp && !msg.result.aborted && sessionExp.survey_due === false) {
          // 同じ相方との途中の回。アンケートは相方が変わる前にまとめて
          // 答えてもらうので、ここでは出さずに次のゲームへ進む。
          showOverlay('<div class="big">ゲーム終了</div>' + summary +
            `<div class="sub">次は ${esc(sessionExp.agent || 'AI')} との ` +
            `${(sessionExp.game_in_block || 0) + 1} 回目です。<br>まもなく始まります...</div>`);
          try { sessionStorage.setItem(AUTOSTART_STORE, '1'); } catch (e2) {}
          setTimeout(() => location.reload(), 2500);
        } else if (sessionExp && !msg.result.aborted) {
          // そのままアンケートへ。順位や花吹雪は出さない(ほかの参加者との
          // 比較や演出が、その回の評価に混ざらないようにする)。
          showSurvey(sessionExp, msg.result, summary);
        } else if (sessionExp) {
          showOverlay('<div class="big">ゲームが途中で終わりました</div>' + summary +
                      '<div class="sub">この回は数えません。もう一度同じ条件で遊びます。</div>' +
                      '<button onclick="location.reload()">やり直す</button>');
        } else if (mode === 'tutorial') {
          showTutorialResult(msg.result, summary);
        } else if (mode === 'practice') {
          showOverlay('<div class="big">練習おしまい</div>' + summary +
                      '<div class="go"><button class="primary" id="again">もう一度練習する</button> ' +
                      '<button id="to-top">最初に戻る</button></div>');
          document.getElementById('again').addEventListener('click', startPractice);
          document.getElementById('to-top').addEventListener('click', () => {
            setMode(''); renderModePick();
          });
        } else {
          showOverlay('<div class="big">ゲーム終了</div>' + summary +
                      '<button onclick="location.reload()">もう一度遊ぶ</button>');
        }
      }
    }
  };

  // チュートリアルの1段階が終わったあと。途中で切れた回は数えず、
  // 同じ段階をもう一度。最後まで行ったら最初の選択へ戻す。
  function showTutorialResult(result, summary) {
    if (result.aborted) {
      showOverlay('<div class="consent"><div class="big">途中で終わりました</div>' + summary +
                  '<div class="go"><button class="primary" id="tut-next">' +
                  'もう一度やる</button></div></div>');
      document.getElementById('tut-next').addEventListener('click', showTutorialCard);
      return;
    }
    const order = tutorialOrder();
    const pos = tutorialPos();
    const last = pos >= order.length - 1;
    if (last) {
      setStep(0);
      markTutorialDone();
      if (inHonban()) {
        // 本番の流れ: 練習が終わったら、そのまま本番のゲームへ
        setMode('experiment');
        showOverlay('<div class="consent"><div class="big">練習はここまでです</div>' + summary +
                    '<div class="sub">おつかれさまでした。次から本番です</div>' +
                    '<div class="go"><button class="primary" id="tut-next">本番に進む</button></div></div>');
        // 割り当てが届いてから 1 度だけ描く(先に描くと、届いたときに描き直して 2 度出てくる)
        document.getElementById('tut-next').addEventListener('click', () => {
          loadAssignment(false).then(showStart);
        });
        return;
      }
      setMode('');
      showOverlay('<div class="consent"><div class="big">チュートリアルは終わりです</div>' + summary +
                  '<div class="sub">おつかれさまでした</div>' +
                  '<div class="go"><button class="primary" id="tut-next">' +
                  '最初に戻る</button></div></div>');
      document.getElementById('tut-next').addEventListener('click', renderModePick);
      return;
    }
    const done = TUTORIALS[tutorialStep].title;
    setStep(order[pos + 1]);
    showOverlay(`<div class="consent"><div class="big">${esc(done)}はここまで</div>` + summary +
                '<div class="go"><button class="primary" id="tut-next">' +
                `次へ (${esc(TUTORIALS[tutorialStep].title)})</button>` +
                (inHonban() ? '' : ' <button id="tut-stop">やめる</button>') + '</div></div>');
    document.getElementById('tut-next').addEventListener('click', showTutorialCard);
    const stop = document.getElementById('tut-stop');
    if (stop) stop.addEventListener('click', () => { setMode(''); renderModePick(); });
  }

  // ---- バグの報告 --------------------------------------------------------
  // 遊んでいる最中に様子がおかしかったら、その場で書いて残してもらう。
  // 書いた内容とそこまでのリプレイをサーバーが保存し、その回は打ち切って
  // 同じ条件でやり直す(打ち切った回はセッション数に数えない)。
  function showBugForm() {
    const wasPlaying = playing;
    playing = false;
    // 書いている間はゲームの時間を止める(残り時間も減らない)。
    sendNow({ type: 'pause', on: true });
    showOverlay(
      '<div class="survey">' +
      '<div class="big">バグを報告</div>' +
      '<div class="sub">書いている間、ゲームは止まっています。<br>' +
      'どこがおかしかったか、覚えている範囲で書いてください。<br>' +
      'そのときの状況は自動で保存されます。</div>' +
      '<div class="q"><textarea id="bug-text" rows="4" ' +
      'placeholder="例: AIがミキサーの前で止まったまま動かなかった"></textarea></div>' +
      '<div class="err" id="bug-err"></div>' +
      '<div class="go">' +
      '<button class="primary" id="bug-send">送信してやり直す</button> ' +
      '<button id="bug-cancel">やめる</button>' +
      '</div></div>');
    document.getElementById('bug-text').focus();

    document.getElementById('bug-cancel').addEventListener('click', () => {
      hideOverlay();
      playing = wasPlaying;
      sendNow({ type: 'pause', on: false });
    });
    document.getElementById('bug-send').addEventListener('click', () => {
      const btn = document.getElementById('bug-send');
      const err = document.getElementById('bug-err');
      btn.disabled = true;
      err.textContent = '送っています...';
      fetch('/api/bug', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: document.getElementById('bug-text').value }),
      }).then(r => r.json()).then((r) => {
        if (!r.ok) throw new Error(r.error || '保存できませんでした');
        settled = true;          // 切断の案内で上書きしない
        reporting = true;        // 終了の知らせでも上書きしない
        showOverlay('<div class="big">ありがとうございました</div>' +
          '<div class="sub">記録しました。<br>同じ条件でやり直します...</div>');
        if (sessionExp) {
          try { sessionStorage.setItem(AUTOSTART_STORE, '1'); } catch (e) {}
        }
        setTimeout(() => location.reload(), 1500);
      }).catch((e) => {
        err.textContent = String(e.message || e);
        btn.disabled = false;
      });
    });
  }

  // ---- 質問を 1 問ずつ出す仕組み ---------------------------------------
  // 参加者は、文章が何か所にも同時に出ると読み切れない。質問は 1 画面に
  // 1 問だけ出し、答えると次の質問がうっすらと出てくる。教示(どう答えるか
  // の説明)は、それだけで 1 枚にする。戻って直すこともできる。
  //   steps: [{kind:'info', html, ctx?}, {kind:'five', name, text, ctx?},
  //           {kind:'pick', name, text, choices:[[value,label]], ctx?},
  //           {kind:'input', name, text, input:'text'|'number', optional, note}]
  //   ctx は質問の上に小さく出す見出し(いま何について答えているか)
  const FIVE_ENDS = ['全くそう思わない', '強くそう思う'];
  function runQuestions({ steps, answers = {}, head = '', onChange = null,
                          onFinish, finishText = 'これで質問は終わりです',
                          finishLabel = '送信する', cls = 'survey' }) {
    const qCount = steps.filter((s) => s.kind !== 'info').length;
    // 前に答えた分があれば、最初の未回答から始める
    let i = 0;
    if (Object.keys(answers).length) {
      const k = steps.findIndex((s) => s.kind !== 'info' && !s.optional &&
                                        (answers[s.name] === undefined || answers[s.name] === ''));
      i = k < 0 ? steps.length : Math.max(0, k);
    }
    const qNo = (idx) => steps.slice(0, idx + 1).filter((s) => s.kind !== 'info').length;
    const render = () => {
      const s = steps[i];
      let body = '';
      let canNext = false;
      if (!s) {
        body = `<div class="q-final"><div class="q-text">${esc(finishText)}</div>` +
               '<div class="err" id="q-err"></div>' +
               `<div class="go"><button type="button" class="primary" id="q-send">${esc(finishLabel)}</button></div></div>`;
      } else if (s.kind === 'info') {
        body = `<div class="q-info">${s.html}</div>`;
        canNext = true;
      } else {
        const v = answers[s.name];
        const ctx = s.ctx ? `<div class="q-ctx">${esc(s.ctx)}</div>` : '';
        let field = '';
        if (s.kind === 'five') {
          field = '<div class="q-five">' + [1, 2, 3, 4, 5].map((k) =>
            `<button type="button" class="q-opt${v === k ? ' on' : ''}" data-v="${k}">${k}</button>`).join('') +
            '</div>' +
            `<div class="anchors"><span>${esc(FIVE_ENDS[0])}</span><span>${esc(FIVE_ENDS[1])}</span></div>`;
        } else if (s.kind === 'pick') {
          field = '<div class="q-pick">' + s.choices.map(([val, lab]) =>
            `<button type="button" class="q-opt${v === val ? ' on' : ''}" data-v="${esc(val)}">${esc(lab)}</button>`)
            .join('') + '</div>';
        } else if (s.kind === 'input') {
          field = `<input type="${s.input === 'number' ? 'number' : 'text'}" class="q-input" ` +
                  `autocomplete="off" spellcheck="false" value="${esc(v === undefined ? '' : String(v))}">` +
                  (s.note ? `<div class="q-note">${esc(s.note)}</div>` : '');
          canNext = !!s.optional || (v !== undefined && String(v).trim() !== '');
        }
        body = ctx + `<div class="q-text">${esc(s.text)}</div>` + field;
        if (s.kind === 'input') canNext = canNext;
      }
      const nav = s ? (
        '<div class="q-nav">' +
        (i > 0 ? '<button type="button" class="q-back">戻る</button>' : '<span></span>') +
        ((s.kind === 'info' || s.kind === 'input')
          ? `<button type="button" class="primary q-next"${canNext ? '' : ' disabled'}>次へ</button>`
          : '<span></span>') +
        '</div>' +
        (s.kind !== 'info' ? `<div class="q-count">${qNo(i)} / ${qCount}</div>` : '')
      ) : (i > 0 ? '<div class="q-nav"><button type="button" class="q-back">戻る</button><span></span></div>' : '');
      showOverlay(`<div class="${cls} qrun">${head}<div class="q-card">${body}</div>${nav}</div>`);
      const root = el.overlayText.firstElementChild;
      const go = (d) => { i = Math.max(0, Math.min(steps.length, i + d)); render(); };
      const back = root.querySelector('.q-back');
      if (back) back.addEventListener('click', () => go(-1));
      const next = root.querySelector('.q-next');
      if (next) next.addEventListener('click', () => go(1));
      root.querySelectorAll('.q-opt').forEach((b) => b.addEventListener('click', () => {
        const val = s.kind === 'five' ? Number(b.dataset.v) : b.dataset.v;
        answers[s.name] = val;
        root.querySelectorAll('.q-opt').forEach((x) => x.classList.toggle('on', x === b));
        if (onChange) onChange(answers);
        // 押したことが見えてから次へ(すぐ消えると、押せたか分からない)
        setTimeout(() => { if (steps[i] === s) go(1); }, 280);
      }));
      const inp = root.querySelector('.q-input');
      if (inp) {
        inp.addEventListener('input', () => {
          answers[s.name] = inp.value;
          if (next) next.disabled = !(s.optional || inp.value.trim() !== '');
          if (onChange) onChange(answers);
        });
        inp.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && next && !next.disabled) next.click();
        });
        setTimeout(() => inp.focus(), 50);
      }
      const send = root.querySelector('#q-send');
      if (send) {
        send.addEventListener('click', () => {
          const err = root.querySelector('#q-err');
          const miss = steps.findIndex((x) => x.kind !== 'info' && !x.optional &&
                                              (answers[x.name] === undefined || answers[x.name] === ''));
          if (miss >= 0) { i = miss; render(); return; }
          send.disabled = true;
          onFinish(answers, (msg) => { err.textContent = msg; send.disabled = false; });
        });
      }
    };
    render();
  }

  // 人ごとに決まった順に並べる(同じ人ならどのゲームでも同じ順)。
  function seededShuffle(list, seedText) {
    let h = 2166136261;
    for (const ch of String(seedText || '')) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
    let x = h >>> 0;
    const rnd = () => {           // mulberry32
      x |= 0; x = (x + 0x6D2B79F5) | 0;
      let t = Math.imul(x ^ (x >>> 15), 1 | x);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const a = list.slice();
    for (let k = a.length - 1; k > 0; k--) {
      const j = Math.floor(rnd() * (k + 1));
      [a[k], a[j]] = [a[j], a[k]];
    }
    return a;
  }

  // ---- アンケート(各ゲームの後) ----------------------------------------
  // アンケート仕様書(最終版, 2026-10-06)の C。1 ゲームあたり 18 項目、すべて 5 段階。
  //   C-1 ラポール(CCR 尺度 8 項目版の日本語訳)。順は人ごとにランダム
  //   C-2 指示の扱いについての体験(独自 7 項目)。順は人ごとにランダム
  //   C-3 プレイ体験(miniPXI 3 項目)
  // C-1 と C-2 は別の項目群として、それぞれの教示を先に出す。
  //   Lin, Chen, Mutlu, Trafton, Sebo (2026) "The Reduced-Length
  //   Connection-Coordination Rapport (CCR) Scale", ACM THRI 15(3) 57.
  const CCR_CONNECTION = [
    ['conn_1', 'つながりを感じた'],
    ['conn_2', '打ち解けられた'],
    ['conn_3', '気持ちが通じ合った'],
    ['conn_4', 'おたがいのやり方を大事にしていた'],
  ];
  const CCR_COORDINATION = [
    ['coord_1', '息が合っていた'],
    ['coord_2', 'おたがいに積極的だった'],
    ['coord_3', 'やりとりがスムーズだった'],
    ['coord_4', 'おたがいに気を配っていた'],
  ];
  // C-2。画面では「エージェント X は、」を前に付ける。
  const OWN_ITEMS = [
    ['own_respect', '私の指示を大切に扱ってくれた'],
    ['own_intent', '私が何をしたいのかを分かっていた'],
    ['own_complement', '私が言わなくても必要な作業をしてくれた'],
    ['own_initiative', '私が任せたい部分と指示したい部分に合わせて動いた'],
    ['own_judgment', '私が納得できる判断で動いた'],
    ['own_predict', '私が予想したとおりに動いた'],
    ['own_postponed', '私の指示を後回しにした'],
  ];
  const PLAY_ITEMS = [
    ['play_fun', 'このゲームを楽しくプレイできた'],
    ['play_free', 'このゲームを自分なりのやり方で自由にプレイできた'],
    ['play_skill', 'このゲームをうまくプレイできた'],
  ];
  let surveyAnswers = {};

  function surveySteps(exp, summary) {
    const agent = exp.agent || 'AI';
    const pid = exp.participant_id || participantId || '';
    const ccr = seededShuffle([...CCR_CONNECTION, ...CCR_COORDINATION], `ccr:${pid}`);
    const own = seededShuffle(OWN_ITEMS, `own:${pid}`);
    const steps = [];
    steps.push({ kind: 'info', html:
      '<div class="big">ゲーム終了</div>' + (summary || '') +
      `<div class="sub">${esc(agent)} とのゲームについて、質問に答えてください` +
      `<br>(${exp.session} / ${exp.sessions_total})</div>` });
    const c1 = `今のゲームでの${agent} とのやりとりについて、次のことがどの程度当てはまるかを答えてください`;
    steps.push({ kind: 'info', html: `<div class="q-text">${esc(c1)}</div>` });
    ccr.forEach(([name, text]) => steps.push(
      { kind: 'five', name, text, ctx: `${agent} とのやりとりについて` }));
    const c2 = `今のゲームでの${agent} の振る舞いについて、次のことがどの程度当てはまるかを答えてください`;
    steps.push({ kind: 'info', html: `<div class="q-text">${esc(c2)}</div>` });
    own.forEach(([name, text]) => steps.push(
      { kind: 'five', name, text: `${agent} は、${text}`, ctx: `${agent} の振る舞いについて` }));
    const c3 = '今のゲームについて、次のことがどの程度当てはまるかを答えてください';
    steps.push({ kind: 'info', html: `<div class="q-text">${esc(c3)}</div>` });
    PLAY_ITEMS.forEach(([name, text]) => steps.push(
      { kind: 'five', name, text, ctx: '今のゲームについて' }));
    return { steps, ccrOrder: ccr.map(([n]) => n), ownOrder: own.map(([n]) => n) };
  }

  function showSurvey(exp, result, summary, answers) {
    playing = false;
    surveyAnswers = Object.assign({}, answers || {});
    const { steps, ccrOrder, ownOrder } = surveySteps(exp, summary);
    el.overlay.classList.add('form');
    el.overlay.classList.add('solid');
    document.body.classList.add('survey');
    // 出した時点と、答えるたびに残す。送れたら消す。
    saveSurveyDraft(exp, result, summary);
    runQuestions({
      steps, answers: surveyAnswers,
      onChange: () => saveSurveyDraft(exp, result, summary),
      onFinish: (ans, fail) => {
        const body = {
          participant_id: exp.participant_id, session: exp.session,
          pattern: exp.pattern || (lastSelection && lastSelection.pattern) || null,
          map: exp.map, skip_budget: exp.skip_budget, case: exp.case,
          group: exp.group || (lastSelection && lastSelection.group) || '',
          agent: exp.agent || '', block: exp.block || null,
          game_in_block: exp.game_in_block || null,
          served: result.served, failed: result.failed,
          makespan_s: result.makespan_s,
          order_ccr: ccrOrder, order_own: ownOrder,
        };
        for (const [name] of [...CCR_CONNECTION, ...CCR_COORDINATION, ...OWN_ITEMS, ...PLAY_ITEMS]) {
          body[name] = ans[name];
        }
        fetch('/api/survey', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                               body: JSON.stringify(body) })
          .then(r => r.json())
          .then((r) => {
            if (!r.ok) throw new Error(r.error || '保存できませんでした');
            clearSurveyDraft();
            el.overlay.classList.remove('form');
            const last = exp.session >= exp.sessions_total;
            // 盤面と操作ボタンを戻す(次の回はこの上で遊ぶ)
            document.body.classList.remove('survey');
            el.overlay.classList.remove('solid');
            if (last) { showFinish(); return; }
            // 続きは自動で始める。ボタンを押させると、押し忘れたまま
            // 待ちが続いてしまう。
            showOverlay('<div class="consent"><div class="big">ありがとうございました</div>' +
              (exp.agent
                ? `<div class="sub">次は${esc('エージェント ' + String.fromCharCode(65 + (exp.block || 1)))} とのゲームです。</div>`
                : `<div class="sub">次はゲーム ${exp.session + 1} / ${exp.sessions_total} です。</div>`) +
              '<div class="sub">まもなく始まります</div></div>');
            try { sessionStorage.setItem(AUTOSTART_STORE, '1'); } catch (e2) {}
            setTimeout(() => location.reload(), 2600);
          })
          .catch((e) => fail(String(e.message || e)));
      },
    });
  }

  // 全部終わったときの画面。条件を変えていたことなどは伝えない(2026-10-07)。
  function showFinish() {
    try { sessionStorage.removeItem(HONBAN_STORE); } catch (e) {}
    // 読み込み直したら最初の選択に戻す。実験の状態のままだと、次の人の前に
    // 前の人の「全部終わっています」とスタートのボタンが出てしまう。
    setMode('');
    revealSteps({
      head: '<div class="big">ご協力ありがとうございました</div>',
      items: [
        '<div class="c-t">これで実験はすべて終わりです。</div>',
        '<div class="c-t">お疲れさまでした。画面はこのまま閉じてください。</div>',
      ],
      final: '',
    });
  }

  // ---- AIへの指示(ゲーム画面の下に出す) ---------------------------------
  // 画面を覆わないので、盤面を見ながら選べる。時間制限は無い。
  const instructBox = document.getElementById('instruct');
  let instructDone = false;     // この回の指示をもう選んだか
  let instructShown = false;    // いま指示を出しているか
  let instructInterpHandler = null;   // 文章の解釈の結果を受け取る(パターン7)
  function showInstruct(msg) {
    // 押しっぱなしのキーは、止める前にきちんと離しておく。残したままだと
    // 「離した」の合図が届かず、指示のあと手を出せなくなる。
    [...held].forEach(holdEnd);
    instructShown = true;
    if (!started) {
      // まだ始まっていない = 開始前の指示。数えている途中でも必ず止める。
      // 指示を選んでいる間に数え終わると、決めた時点でもう時間が進んで
      // いることになる。選び終えてから数え直す。
      // (サーバーが「この回は指示がある」と伝えてこない場合でも、ここで
      //  止まるので順番は変わらない)
      instructDone = false;
      needInstruction = true;
      cancelCountdown();
    }
    hideOverlay();              // 盤面を見ながら選べるように
    const who = (msg.players || []).map((p) =>
      `<span><img src="${esc(gfxUrl((p.sprite || 'agent-blue') + '-front'))}" ` +
      `onerror="this.src='${esc(gfxUrl(p.sprite || 'agent-blue'))}'">` +
      `${esc(p.name)}</span>`).join('');
    const lead = document.getElementById('instruct-lead');
    if (lead) {
      lead.textContent = started
        ? '選んでから「決定」を押してください'
        : 'AIに今すぐやってほしい作業を指示してください';
    }
    document.getElementById('instruct-who').innerHTML = who;
    // 指示を選ぶ間は移動・使うボタンを隠す。盤面の位置が動かないよう、
    // 隠す前にボタンの高さを測って、同じ高さを確保する。
    const padBox = pad.getBoundingClientRect();
    if (padBox.height) instructBox.style.minHeight = padBox.height + 'px';
    pad.classList.add('hidden');
    const box = document.getElementById('instruct-cards');
    const ok = document.getElementById('instruct-ok');
    // 選んだ内容。index はカードで選んだ1つ、indices は文章の解釈を確認した
    // 1つ以上の候補。label はバーに残す言い方。via は決め方(cards / text)。
    const S = { index: null, indices: null, exclude: null, label: '', via: 'cards', conf: null };
    ok.disabled = true;
    // 指示への自信(1〜5)。実験の回では、指示と一緒に答えてもらう。ゲームの
    // あとに聞くと、AI の動きを見たあとの自信になってしまう。
    const askConf = !!msg.ask_confidence;
    const confBox = document.getElementById('instruct-conf');
    const confScale = document.getElementById('instruct-conf-scale');
    // 質問(B1)は、指示を選んだあとに出す。カードと同時に出すと、
    // 読むものが 2 か所に同時に現れる(2026-10-07)。
    confBox.classList.add('hidden');
    confScale.innerHTML = askConf
      ? [1, 2, 3, 4, 5].map((v) => `<button type="button" data-v="${v}">${v}</button>`).join('')
      : '';
    // 「決定」は、指示(と自信)を選び終えてから押せる。
    const refreshOk = () => {
      const chosen = !(S.index === null && !S.indices);
      if (askConf && chosen && confBox.classList.contains('hidden')) {
        confBox.classList.remove('hidden');
        confBox.classList.remove('anim-in');
        void confBox.offsetWidth;
        confBox.classList.add('anim-in');
      }
      ok.disabled = !chosen || (askConf && S.conf === null);
    };
    confScale.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
      S.conf = Number(b.dataset.v);
      confScale.querySelectorAll('button').forEach((o) => o.classList.toggle('on', o === b));
      refreshOk();
    }));
    ok.onclick = () => {
      if ((S.index === null && !S.indices) || (askConf && S.conf === null)) return;
      showCurrentInstruction(S.label);
      sendNow({ type: 'instruct', seq: msg.seq, index: S.index, indices: S.indices,
                exclude: S.exclude, via: S.via, confidence: S.conf });
      moveBlockUntil = performance.now() + stepMs;
      instructInterpHandler = null;
      hideInstruct();
      instructDone = true;
      if (!started) beginCountdown();   // 決めてから 3・2・1
    };
    if (msg.input === 'text') {
      renderInstructText(msg, S, refreshOk);
    } else {
      renderInstructCards(msg, S, refreshOk);
    }
    instructBox.classList.add('show');
    document.body.classList.add('instructing');   // スマホでは盤面を小さくする
  }

  // ---- 文章で書く指示(パターン7) --------------------------------------------
  // 書いた文をサーバーへ送り、LLM の解釈(候補のどれか)を見せて確認する。
  // 合っていれば「この内容にする」-> 決定。違えば書き直す(一覧から選ぶ逃げ道は無い)。
  function renderInstructText(msg, S, refreshOk, prevText) {
    const box = document.getElementById('instruct-cards');
    S.index = null; S.indices = null; S.exclude = null; S.label = ''; S.via = 'text';
    refreshOk();
    box.innerHTML =
      '<div class="nl">' +
      `<div class="hint">${esc(msg.hint || 'エージェントに今すぐやってほしい作業を、具体的に書いてください。')}</div>` +
      `<textarea id="nl-text" rows="2" maxlength="300" placeholder="例: トマトレタススープを1つと、たまねぎを1つ切って">${esc(prevText || '')}</textarea>` +
      '<div class="row2"><button type="button" class="primary" id="nl-send">送る</button></div>' +
      '<div id="nl-result"></div></div>';
    const ta = document.getElementById('nl-text');
    const send = document.getElementById('nl-send');
    const result = document.getElementById('nl-result');
    const submit = () => {
      const text = (ta.value || '').trim();
      if (!text) { result.innerHTML = '<div class="wait">作業を書いてください</div>'; return; }
      send.disabled = true;
      ta.disabled = true;
      result.innerHTML = '<div class="wait">解釈しています...</div>';
      sendNow({ type: 'instruct_text', seq: msg.seq, text });
      // 返事が来なければ(通信や API の不調)、もう一度送ってもらう
      const timer = setTimeout(() => {
        if (instructInterpHandler !== onInterp) return;
        showResult({ ok: false, message: '返事が来ませんでした。もう一度送ってください。' });
      }, 40000);
      const onInterp = (r) => { clearTimeout(timer); showResult(r); };
      instructInterpHandler = onInterp;
    };
    const showResult = (r) => {
      instructInterpHandler = null;
      send.disabled = false;
      ta.disabled = false;
      if (r.ok && (r.tasks || []).length) {
        S.indices = r.tasks.map((t) => t.index);
        S.exclude = (r.exclude || []).length ? r.exclude : null;
        const exclJa = { chop: '切る', cook: '煮る', serve: '提供' };
        S.label = r.tasks.map((t) => t.label).join('、') +
          (S.exclude ? `(${S.exclude.map((e) => exclJa[e] || e).join('・')}はあなた)` : '');
        S.via = 'text';
        // 上段: 指示の解釈(候補の言い方)。下段: AI がやる作業の流れ図。
        // 段の中(切る同士)は並列で、計画でもどちらから切ってもよい。
        const flow = (t) => {
          const st = (t.stages || []).length ? t.stages : [(t.steps || [t.label])];
          return '<div class="flow">' + st.map((nodes) =>
            `<div class="stage">${nodes.map((n) => `<div class="node">${esc(n)}</div>`).join('')}</div>`
          ).join('<div class="arrow">→</div>') + '</div>';
        };
        result.innerHTML =
          '<div class="interp ok"><h4>指示の解釈</h4>' +
          r.tasks.map((t) => `<div class="reading">${esc(t.label)}</div>`).join('') +
          '<h4>エージェントがやる作業の流れ</h4>' + r.tasks.map(flow).join('') +
          '<div class="sysnote">※ 解釈は自動で行っています。自分の指示と合っているか(料理・材料・個数)を確かめ、' +
          '違っていれば「書き直す」で書き直してください。</div>' +
          '<div class="row2"><button type="button" class="primary" id="nl-yes">この内容にする</button>' +
          '<button type="button" id="nl-retry">書き直す</button></div></div>';
        document.getElementById('nl-yes').addEventListener('click', () => {
          refreshOk();
          document.getElementById('nl-yes').textContent = askConf && S.conf === null
            ? '自信を選んでから「決定」を押してください' : '「決定」を押してください';
          document.getElementById('instruct-ok').scrollIntoView({ block: 'nearest' });
        });
      } else {
        S.indices = null; S.label = '';
        refreshOk();
        // システムからの確認として出す(AI の相方が断ったのではない)。
        // 文は場合分けごとの定型文(instruction_nl.PATTERN_JA)。
        result.innerHTML =
          '<div class="interp ng"><div class="sys">システムからの確認</div>' +
          `${esc(r.message || '解釈の処理がうまくいきませんでした。もう一度送ってください。')}` +
          '<div class="sysnote">※ エージェントが断ったのではなく、指示の文を確かめています。</div>' +
          '<div class="row2"><button type="button" class="primary" id="nl-retry">書き直す</button></div></div>';
      }
      document.getElementById('nl-retry').addEventListener('click', () => {
        renderInstructText(msg, S, refreshOk, ta.value);
      });
    };
    const askConf = !!msg.ask_confidence;
    send.addEventListener('click', submit);
    ta.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
    });
    ta.focus();
  }

  // ---- 一覧(カード)から選ぶ指示 ----------------------------------------------
  function renderInstructCards(msg, S, refreshOk) {
    S.index = null; S.indices = null; S.exclude = null; S.label = ''; S.via = 'cards';
    refreshOk();
    // 段(切る / 調理する / 提供まで任せる)ごとに行を分ける。
    // 同じ工程が複数あるカードは、選ぶと中に「1つ / 2つ」が出る。
    const items = msg.items || [];
    const layerName = msg.layers || {};
    const rows = [];
    items.forEach((it, i) => {
      const L = it.layer == null ? 2 : it.layer;
      let row = rows.find((r) => r.layer === L);
      if (!row) { row = { layer: L, html: '' }; rows.push(row); }
      const opts = it.options || [{ count: 1, index: it.index != null ? it.index : i }];
      const counts = opts.length > 1
        ? `<span class="counts">${opts.map((o, k) =>
            `<span data-k="${k}" class="${k === 0 ? 'sel' : ''}">${o.count}つ</span>`).join('')}</span>`
        : '';
      row.html +=
        `<button type="button" data-i="${i}" data-index="${opts[0].index}">` +
        (it.icon ? `<img src="${esc(gfxUrl(it.icon))}" alt="">` : '') +
        `<span class="t"><span><b>${esc(it.label)}</b><span class="act">${it.action ? 'を' + esc(it.action) : ''}</span></span>` +
        (it.steps ? `<span class="steps">${esc(it.steps)}</span>` : '') +
        `</span>${counts}</button>`;
    });
    rows.sort((a, b) => a.layer - b.layer);
    const cards = rows.map((r) =>
      `<div class="row">` +
      (rows.length > 1 && layerName[String(r.layer)] ? `<div class="row-name">${esc(layerName[String(r.layer)])}</div>` : '') +
      r.html + '</div>').join('');
    const box = document.getElementById('instruct-cards');
    box.innerHTML = cards;
    // 押した瞬間には送らない。移動ボタンを操作しているときに指が触れて
    // そのまま送ってしまうため、いったん選ぶだけにして「決定」で送る。
    let chosen = null;
    box.querySelectorAll('button').forEach((b) => b.addEventListener('click', (ev) => {
      const it = items[Number(b.dataset.i)] || {};
      const opts = it.options || [];
      // 個数のつまみを押したら、その個数の候補に切り替える
      const chip = ev.target.closest('.counts span');
      if (chip && opts.length > 1) {
        b.querySelectorAll('.counts span').forEach((c) => c.classList.toggle('sel', c === chip));
        chosen = opts[Number(chip.dataset.k)].index;
      } else if (b.classList.contains('on')) {
        return;                            // 同じカードをもう一度: そのまま
      } else {
        const picked = b.querySelector('.counts span.sel');
        chosen = picked && opts.length > 1 ? opts[Number(picked.dataset.k)].index : Number(b.dataset.index);
      }
      box.querySelectorAll('button').forEach((o) => o.classList.toggle('on', o === b));
      // 何を指示したかをバーに残す(「たまねぎを2つ切って」)
      const opt = (it.options || []).find((o) => o.index === chosen);
      const n = opt && (it.options || []).length > 1 ? `${opt.count}つ` : '';
      S.index = chosen; S.indices = null; S.exclude = null; S.via = 'cards';
      S.label = `${it.label}を${n}${it.action || ''}`;
      refreshOk();
    }));
  }
  function showCurrentInstruction(text) {
    const box = document.getElementById('cur-instr');
    const t = document.getElementById('cur-instr-text');
    if (!box || !t) return;
    t.textContent = text || '';
    box.classList.toggle('hidden', !text);
  }
  function hideInstruct() {
    instructShown = false;
    instructInterpHandler = null;
    instructBox.classList.remove('show');
    document.body.classList.remove('instructing');
    pad.classList.remove('hidden');
  }

  let toastTimer = null;
  function showToast(text) {
    const t = document.getElementById('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), Math.max(2500, text.length * 90));
  }
  // 画面を出す。中身は上から少しずつずらして、うっすらと出す(fadeIn)。
  // 同じ中身を出し直すときは何もしない(出し直すたびに動きが始まって点滅する)。
  let lastOverlayHtml = null;
  function showOverlay(html) {
    const shown = el.overlay.classList.contains('show');
    if (shown && html === lastOverlayHtml) return;
    lastOverlayHtml = html;
    el.overlayText.innerHTML = html;
    if (!shown) {
      // 出し直すと #overlay の動きも最初から
      el.overlay.classList.remove('show');
      void el.overlay.offsetWidth;
    }
    el.overlay.classList.add('show');
    fadeIn(el.overlayText.firstElementChild);
  }
  // 要素の子を、上から順に少しずつずらして出す(2 つ以上を同時に出さない)。
  function fadeIn(root, step = 0.22, start = 0) {
    if (!root) return;
    const kids = root.children && root.children.length ? [...root.children] : [root];
    kids.forEach((k, i) => {
      k.classList.remove('anim-in');
      void k.offsetWidth;
      k.style.animationDelay = `${(start + Math.min(i, 8) * step).toFixed(2)}s`;
      k.classList.add('anim-in');
    });
  }
  function hideOverlay() { el.overlay.classList.remove('show'); lastOverlayHtml = null; }

  // 1 回のクリックで情報を 1 つずつ足す画面。
  //   head : 見出し(最初から出す)
  //   items: 足していく項目(HTML)。最初の 1 つは見出しと一緒に出す
  //   final: 全部出し終えたあとに出す操作(ボタン・チェック欄など)
  //   onReady(root): final を出したあとに呼ぶ(操作の取り付け)
  //   cls  : 外枠のクラス(consent / stage-pick など)
  // 前に出した項目は少し薄くし、いま足した項目に目が行くようにする。
  function revealSteps({ head = '', items = [], final = '', onReady = null,
                         cls = 'consent', nextLabel = '次へ' }) {
    showOverlay(`<div class="${cls} reveal">${head}<div class="r-list"></div>` +
                '<div class="r-next"></div></div>');
    const root = el.overlayText.firstElementChild;
    const list = root.querySelector('.r-list');
    const next = root.querySelector('.r-next');
    let i = 0;
    const add = () => {
      list.querySelectorAll('.r-item').forEach((x) => x.classList.add('old'));
      const d = document.createElement('div');
      d.className = 'r-item';
      d.innerHTML = items[i];
      list.appendChild(d);
      fadeIn(d.children.length ? d : d, 0.25, i === 0 ? 0.2 : 0);
      i += 1;
      if (i < items.length) {
        next.innerHTML = `<button type="button" class="primary r-go">${nextLabel}</button>` +
                         `<div class="r-count">${i} / ${items.length}</div>`;
        next.querySelector('.r-go').addEventListener('click', add);
      } else {
        // 最後の項目を読んでから操作が出るよう、少し遅らせる
        next.innerHTML = final;
        fadeIn(next, 0.25, 0.35);
        if (onReady) onReady(root);
      }
      fadeIn(next, 0.2, 0.25);
      d.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    };
    if (items.length) add();
    else { next.innerHTML = final; fadeIn(next); if (onReady) onReady(root); }
    return root;
  }

  // ゲームが始まるまで(カウントダウン中も)は移動・指示を送らない。
  // 送ると、止まっている間に溜まり、始まった瞬間に勝手に動いてしまう。
  let playing = false;
  function sendNow(obj) {
    if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
  }
  function send(obj) {
    if (obj.type === 'key') {
      if (!playing) return;
      pushKey(obj.code);       // 移動は先読みしてから送る
      return;
    }
    sendNow(obj);
  }
  // 説明や質問を読み進めている間も枠は取ったまま。操作しているあいだは
  // 「スタートされない」として追い出されないよう、サーバーに知らせる(間引いて)。
  let lastActiveSent = 0;
  const noteActive = () => {
    const now = Date.now();
    if (now - lastActiveSent < 5000) return;
    lastActiveSent = now;
    try { sendNow({ type: 'active' }); } catch (e) {}
  };
  document.addEventListener('pointerdown', noteActive, true);
  document.addEventListener('keydown', noteActive, true);

  // ---- 入力 ------------------------------------------------------------
  const KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
                        'Space', 'Enter', 'Escape']);
  // WASD でも同じように動けるようにする。ここで矢印キーに読み替えるので、
  // ここから先(送信・先読み・長押し)は矢印キーと同じ扱いになる。
  const WASD = { KeyW: 'ArrowUp', KeyA: 'ArrowLeft', KeyS: 'ArrowDown', KeyD: 'ArrowRight' };
  // 文字を打っている最中はゲームの操作として扱わない。参加者ID の欄で
  // W/A/S/D やスペースを打つと、移動の操作とみなして preventDefault して
  // いたため、その文字が入力できなかった。
  function typingInField(e) {
    const el = e.target;
    if (!el || el === document.body) return false;
    const tag = (el.tagName || '').toLowerCase();
    return tag === 'input' || tag === 'textarea' || tag === 'select'
      || el.isContentEditable === true;
  }
  window.addEventListener('keydown', (e) => {
    if (typingInField(e)) return;
    const code = WASD[e.code] || e.code;
    if (!KEYS.has(code)) return;
    e.preventDefault();   // 矢印/Space でのページスクロールを止める
    // 押しっぱなしは OS のキーリピートに任せず、こちらで一定の間隔にする
    // (実験条件をそろえるため。速さは入力の速さ n Hz と同じ)。
    if (e.repeat) return;
    if (DIRS[code] || code === 'Space') { if (playing) holdStart(code); return; }
    send({ type: 'key', code });
  });
  window.addEventListener('keyup', (e) => {
    if (typingInField(e)) return;
    holdEnd(WASD[e.code] || e.code);
  });
  window.addEventListener('blur', () => { [...held].forEach(holdEnd); });

  // マウス座標はサーバー側 Surface の座標へ戻して送る。
  // パネルは display の右側に置かれているので、x に baseW を足す。
  function toSurface(cv, e, offsetX) {
    const r = cv.getBoundingClientRect();
    return {
      x: Math.round((e.clientX - r.left) * cv.width / r.width) + offsetX,
      y: Math.round((e.clientY - r.top) * cv.height / r.height),
    };
  }
  function bindPointer(cv, getOffsetX) {
    // タッチには「ホバー」が無いので、押した位置へカーソルを動かしてから
    // クリックとして送る(指示パネルはホバー中のカードで選択を判定する)。
    cv.addEventListener('pointermove', (e) => {
      if (e.pointerType !== 'mouse') return;
      const p = toSurface(cv, e, getOffsetX());
      send({ type: 'mousemove', x: p.x, y: p.y });
    });
    cv.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      const p = toSurface(cv, e, getOffsetX());
      send({ type: 'mousemove', x: p.x, y: p.y });
      send({ type: 'mousedown', x: p.x, y: p.y });
    });
  }

  // 画面上のボタン。押している間は歩き続け、離すと止まる。
  // 十字キーは、押したまま指を滑らせて別の方向のボタンへ移ると、そこから
  // その方向へ歩く(いったん離して押し直さなくてよい)。指ごとに見ているので、
  // もう一方の指で「使う」を押していても影響しない。
  const pointerBtn = new Map();     // 指(pointerId) -> いま押しているボタン

  function buttonAt(x, y) {
    const el = document.elementFromPoint(x, y);
    return el && el.closest ? el.closest('#pad button') : null;
  }
  function pressButton(id, btn) {
    const code = btn.dataset.code;
    pointerBtn.set(id, btn);
    btn.classList.add('pressed');
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch (err) {} }
    if (DIRS[code] || btn.dataset.repeat) {
      if (playing) holdStart(code);
    } else {
      send({ type: 'key', code });
    }
  }
  function releaseButton(id) {
    const btn = pointerBtn.get(id);
    if (!btn) return;
    pointerBtn.delete(id);
    btn.classList.remove('pressed');
    holdEnd(btn.dataset.code);
  }

  pad.addEventListener('pointerdown', (e) => {
    const btn = buttonAt(e.clientX, e.clientY);
    if (!btn) return;
    e.preventDefault();
    // 指を滑らせても追えるよう、捕まえるのは個々のボタンではなく全体。
    try { pad.setPointerCapture(e.pointerId); } catch (err) {}
    pressButton(e.pointerId, btn);
  });
  // 十字キーを押している指は、スティックのように扱う。指の位置が十字の
  // 中心から見てどちら側かで方向が決まり、押したまま滑らせるだけで向きを
  // 変えられる。斜めには進めないので、縦と横のうち大きい方を採る。
  const dpadEl = document.querySelector('.dpad');
  function stickCode(x, y) {
    const r = dpadEl.getBoundingClientRect();
    const dx = x - (r.left + r.width / 2);
    const dy = y - (r.top + r.height / 2);
    // 真ん中あたりは、どちらとも決められないので今の方向のまま
    if (Math.abs(dx) < r.width * 0.12 && Math.abs(dy) < r.height * 0.12) return null;
    if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? 'ArrowRight' : 'ArrowLeft';
    return dy > 0 ? 'ArrowDown' : 'ArrowUp';
  }
  pad.addEventListener('pointermove', (e) => {
    const cur = pointerBtn.get(e.pointerId);
    if (!cur || !DIRS[cur.dataset.code]) return;   // 「使う」からは滑らせない
    const code = stickCode(e.clientX, e.clientY);
    if (!code || code === cur.dataset.code) return;
    const btn = document.querySelector(`#pad button[data-code="${code}"]`);
    if (!btn) return;
    releaseButton(e.pointerId);
    pressButton(e.pointerId, btn);
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((type) =>
    pad.addEventListener(type, (e) => releaseButton(e.pointerId)));
  pad.addEventListener('contextmenu', (e) => e.preventDefault());
  // ボタンの隙間を触ったときに、ページが拡大・スクロールしないように。
  pad.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });

  bindPointer(gameCv, () => 0);
  bindPointer(panelCv, () => baseW);

  // ---- 実験条件の表示 -------------------------------------------------

  applyPrefs();
  // 向きを変えたとき(縦↔横)やアドレスバーの出入りで、大きさを合わせ直す。
  window.addEventListener('resize', () => { updateCompact(); applyPrefs(); });
})();
</script>
</body>
</html>
