<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overcooked CSP</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1e2229;
    --text: #e8eaed;
    --muted: #9aa2ad;
    --bad: #e8697d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", sans-serif;
    padding: 20px 24px 40px;
    min-height: 100vh;
  }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 12px; letter-spacing: .02em; }

  /* ゲーム画面は必ず左端。指示パネルが出ても位置がずれないよう、
     ゲームとパネルを別々の canvas にして横に並べる。 */
  #stage {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  #stage canvas {
    image-rendering: pixelated;
    display: block;
    background: #000;
    border-radius: 6px;
    box-shadow: 0 6px 24px rgba(0,0,0,.45);
  }
  #game { cursor: default; }
  #panel { cursor: pointer; }
  #panel.hidden { display: none; }

  .bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 20px;
    align-items: center;
    background: var(--panel);
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 12px;
    width: fit-content;
  }
  .bar b { color: var(--text); font-weight: 600; }
  .dot {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; background: var(--bad); margin-right: 6px;
    vertical-align: middle;
  }
  .dot.on { background: #6bd08a; }

  .keys { font-size: 12.5px; color: var(--muted); line-height: 1.9; margin-top: 14px; }
  kbd {
    background: #2a2f38; border: 1px solid #3a414c; border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 7px; font-family: inherit;
    font-size: 12px; color: var(--text);
  }
  #overlay {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(10,12,15,.82); font-size: 16px; text-align: center;
    padding: 24px;
  }
  #overlay.show { display: flex; }
</style>
</head>
<body>

<h1>Overcooked CSP — 実験用プレイ画面</h1>

<div class="bar">
  <span><span id="conn-dot" class="dot"></span><span id="conn">接続中...</span></span>
  <span>RTT <b id="rtt">--</b> ms</span>
  <span>受信 <b id="fps">--</b> fps</span>
  <span>状態 <b id="state">--</b></span>
  <span id="cfg"></span>
</div>

<div id="stage">
  <canvas id="game" width="320" height="400"></canvas>
  <canvas id="panel" class="hidden" width="1" height="1"></canvas>
</div>

<div class="keys">
  <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> で移動 / 向いている先へインタラクト<br>
  <kbd>Space</kbd> でAIへの指示パネル（パネル内はマウスでカードをクリック）
</div>

<div id="overlay"><div id="overlay-text"></div></div>

<script>
(function () {
  // 320x400 のドット絵なので少しだけ拡大する。等倍に近いほど文字が読みやすい。
  const SCALE = 1.5;

  const gameCv = document.getElementById('game');
  const panelCv = document.getElementById('panel');
  const gameCtx = gameCv.getContext('2d');
  const panelCtx = panelCv.getContext('2d');

  const el = {
    conn: document.getElementById('conn'),
    dot: document.getElementById('conn-dot'),
    rtt: document.getElementById('rtt'),
    fps: document.getElementById('fps'),
    state: document.getElementById('state'),
    cfg: document.getElementById('cfg'),
    overlay: document.getElementById('overlay'),
    overlayText: document.getElementById('overlay-text'),
  };

  // サーバー側 Surface の大きさ。base はゲーム画面のみ、full は指示パネル込み。
  let baseW = 320, baseH = 400;
  let fullW = 320, fullH = 400;

  function setCanvas(cv, w, h) {
    if (cv.width !== w) cv.width = w;
    if (cv.height !== h) cv.height = h;
    cv.style.width = (w * SCALE) + 'px';
    cv.style.height = (h * SCALE) + 'px';
  }

  function applyMeta(msg) {
    baseW = msg.base_w; baseH = msg.base_h;
    fullW = msg.w;      fullH = msg.h;

    // ゲーム画面の canvas は常に同じ大きさ・同じ位置のまま動かさない。
    setCanvas(gameCv, baseW, baseH);

    const panelW = Math.max(0, fullW - baseW);
    if (panelW > 0) {
      setCanvas(panelCv, panelW, fullH);
      panelCv.classList.remove('hidden');
    } else {
      panelCv.classList.add('hidden');
    }
  }

  // ---- 描画 --------------------------------------------------------
  let frameTimes = [];
  let drawing = false;

  function drawBlob(blob) {
    // 前の1枚をまだ展開中なら捨てる。溜め込むと表示が実時間から遅れていく。
    if (drawing) return;
    drawing = true;
    createImageBitmap(blob).then(bmp => {
      // 左 baseW ぶんがゲーム画面、その右が指示パネル。切り分けて別々に描く。
      gameCtx.drawImage(bmp, 0, 0, baseW, baseH, 0, 0, baseW, baseH);

      const panelW = bmp.width - baseW;
      if (panelW > 0) {
        if (panelCv.width !== panelW || panelCv.height !== bmp.height) {
          setCanvas(panelCv, panelW, bmp.height);
          panelCv.classList.remove('hidden');
        }
        panelCtx.drawImage(bmp, baseW, 0, panelW, bmp.height,
                                0, 0, panelW, bmp.height);
      }
      bmp.close();
      drawing = false;

      const now = performance.now();
      frameTimes.push(now);
      while (frameTimes.length && now - frameTimes[0] > 2000) frameTimes.shift();
      el.fps.textContent = (frameTimes.length / 2).toFixed(1);
    }).catch(() => { drawing = false; });
  }

  // ---- 接続 --------------------------------------------------------
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.binaryType = 'blob';

  ws.onopen = () => {
    el.conn.textContent = '接続済み';
    el.dot.classList.add('on');
    setInterval(() => {
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'ping', t: performance.now() }));
      }
    }, 1000);
  };

  ws.onclose = () => {
    el.conn.textContent = '切断されました';
    el.dot.classList.remove('on');
    showOverlay('サーバーとの接続が切れました。<br>ページを再読み込みしてください。');
  };

  ws.onmessage = (ev) => {
    if (typeof ev.data !== 'string') { drawBlob(ev.data); return; }

    const msg = JSON.parse(ev.data);
    if (msg.type === 'meta') {
      applyMeta(msg);
    } else if (msg.type === 'pong') {
      el.rtt.textContent = (performance.now() - msg.t).toFixed(0);
    } else if (msg.type === 'status') {
      el.state.textContent = ({
        waiting: '開始待ち', running: 'プレイ中', finished: '終了',
      })[msg.state] || msg.state;
      if (msg.state === 'finished' && msg.result) {
        showOverlay(
          `ゲーム終了<br><br>提供 ${msg.result.served} 件 / 失敗 ${msg.result.failed} 件` +
          `<br>スコア ${msg.result.reward}`);
      }
    }
  };

  function showOverlay(html) {
    el.overlayText.innerHTML = html;
    el.overlay.classList.add('show');
  }

  function send(obj) {
    if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
  }

  // ---- 入力 --------------------------------------------------------
  // キーは押した瞬間だけ送る。サーバーは次の tick(100ms)で適用する。
  const KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Escape']);
  window.addEventListener('keydown', (e) => {
    if (!KEYS.has(e.code)) return;
    e.preventDefault();   // 矢印/Space でのページスクロールを止める
    if (e.repeat) {
      // キーリピートは OS 依存で速度がばらつく。実験条件を揃えるため無視する。
      return;
    }
    send({ type: 'key', code: e.code });
  });

  // マウス座標はサーバー側 Surface の座標へ戻して送る。
  // パネルは display の右側に置かれているので、x に baseW を足す。
  function toSurface(cv, e, offsetX) {
    const r = cv.getBoundingClientRect();
    return {
      x: Math.round((e.clientX - r.left) * cv.width / r.width) + offsetX,
      y: Math.round((e.clientY - r.top) * cv.height / r.height),
    };
  }
  function bindMouse(cv, getOffsetX) {
    cv.addEventListener('mousemove', (e) => {
      const p = toSurface(cv, e, getOffsetX());
      send({ type: 'mousemove', x: p.x, y: p.y });
    });
    cv.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      const p = toSurface(cv, e, getOffsetX());
      send({ type: 'mousedown', x: p.x, y: p.y });
    });
  }
  bindMouse(gameCv, () => 0);
  bindMouse(panelCv, () => baseW);

  // ---- 実験条件の表示 -----------------------------------------------
  fetch('/api/config').then(r => r.json()).then(c => {
    el.cfg.textContent = `map=${c.map} / ${c.agent0} vs ${c.agent1} / orders=${c.orders}`;
  }).catch(() => {});

  setCanvas(gameCv, baseW, baseH);
})();
</script>
</body>
</html>
