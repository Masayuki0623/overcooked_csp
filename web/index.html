        const el2 = el.overlayText.querySelector(`input[name="${name}"]:checked`);
        document.getElementById(`q-${name}`).classList.toggle('todo', !el2);
        if (!el2) { missing.push(name); return null; }
        return el2.value === 'dnf' ? null : Number(el2.value);
      };
      for (let i = 1; i <= 6; i++) body[`coord_${i}`] = read(`coord_${i}`);
      for (let i = 1; i <= 8; i++) body[`trust_${i}`] = read(`trust_${i}`);
      // 自由記述は任意なので、未回答の確認(missing)には入れない。
      for (const [name] of FREE_ITEMS) {
        body[name] = (document.getElementById(name) || {}).value || '';
      }
      if (missing.length) {
        err.textContent = `未回答が ${missing.length} 項目あります(赤い項目)`;
        document.getElementById(`q-${missing[0]}`).scrollIntoView({ block: 'center' });
        return;
      }
      err.textContent = '送信しています...';
      const btn = document.getElementById('sv-send');
      btn.disabled = true;
      fetch('/api/survey', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                             body: JSON.stringify(body) })
        .then(r => r.json())
        .then((r) => {
          if (!r.ok) throw new Error(r.error || '保存できませんでした');
          el.overlay.classList.remove('form');
          const last = exp.session >= exp.sessions_total;
          // 盤面と操作ボタンを戻す(次の回はこの上で遊ぶ)
          document.body.classList.remove('survey');
          el.overlay.classList.remove('solid');
          if (last) {
            showOverlay('<div class="big">ありがとうございました</div>' +
              '<div class="sub">全セッションが終わりました。</div>');
            return;
          }
          // 続きは自動で始める。ボタンを押させると、押し忘れたまま
          // 待ちが続いてしまう。
          showOverlay('<div class="big">ありがとうございました</div>' +
            `<div class="sub">次はセッション ${exp.session + 1} / ${exp.sessions_total} です。` +
            '<br>まもなく始まります...</div>');
          try { sessionStorage.setItem(AUTOSTART_STORE, '1'); } catch (e2) {}
          setTimeout(() => location.reload(), 1800);
        })
        .catch((e) => { err.textContent = String(e.message || e); btn.disabled = false; });
    });
  }

  // ---- AIへの指示(ゲーム画面の下に出す) ---------------------------------
  // 画面を覆わないので、盤面を見ながら選べる。時間制限は無い。
  const instructBox = document.getElementById('instruct');
  let instructDone = false;     // この回の指示をもう選んだか
  let instructShown = false;    // いま指示を出しているか
  function showInstruct(msg) {
    // 押しっぱなしのキーは、止める前にきちんと離しておく。残したままだと
    // 「離した」の合図が届かず、指示のあと手を出せなくなる。
    [...held].forEach(holdEnd);
    instructShown = true;
    if (!started) {
      // まだ始まっていない = 開始前の指示。数えている途中でも必ず止める。
      // 指示を選んでいる間に数え終わると、決めた時点でもう時間が進んで
      // いることになる。選び終えてから数え直す。
      // (サーバーが「この回は指示がある」と伝えてこない場合でも、ここで
      //  止まるので順番は変わらない)
      instructDone = false;
      needInstruction = true;
      cancelCountdown();
    }
    hideOverlay();              // 盤面を見ながら選べるように
    const who = (msg.players || []).map((p) =>
      `<span><img src="${esc(gfxUrl((p.sprite || 'agent-blue') + '-front'))}" ` +
      `onerror="this.src='${esc(gfxUrl(p.sprite || 'agent-blue'))}'">` +
      `${esc(p.name)}</span>`).join('');
    const lead = document.getElementById('instruct-lead');
    if (lead) {
      lead.textContent = started
        ? '選んでから「決定」を押してください'
        : 'AIに最初の指示を出してください';
    }
    document.getElementById('instruct-who').innerHTML = who;
    const cards = (msg.items || []).map((it, i) =>
      `<button type="button" data-i="${i}">` +
      (it.icon ? `<img src="${esc(gfxUrl(it.icon))}" alt="">` : '') +
      `<span>${esc(it.label)}<br><span class="act">${esc(it.action)}</span></span></button>`
    ).join('');
    // 指示を選ぶ間は移動・使うボタンを隠す。盤面の位置が動かないよう、
    // 隠す前にボタンの高さを測って、同じ高さを確保する。
    const padBox = pad.getBoundingClientRect();
    if (padBox.height) instructBox.style.minHeight = padBox.height + 'px';
    pad.classList.add('hidden');
    const box = document.getElementById('instruct-cards');
    box.innerHTML = cards;
    // 押した瞬間には送らない。移動ボタンを操作しているときに指が触れて
    // そのまま送ってしまうため、いったん選ぶだけにして「決定」で送る。
    const ok = document.getElementById('instruct-ok');
    let chosen = null;
    ok.disabled = true;
    box.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
      chosen = Number(b.dataset.i);
      box.querySelectorAll('button').forEach((o) => o.classList.toggle('on', o === b));
      ok.disabled = false;
    }));
    ok.onclick = () => {
      if (chosen === null) return;
      sendNow({ type: 'instruct', seq: msg.seq, index: chosen });
      moveBlockUntil = performance.now() + stepMs;
      hideInstruct();
      instructDone = true;
      if (!started) beginCountdown();   // 決めてから 3・2・1
    };
    instructBox.classList.add('show');
  }
  function hideInstruct() {
    instructShown = false;
    instructBox.classList.remove('show');
    pad.classList.remove('hidden');
  }

  let toastTimer = null;
  function showToast(text) {
    const t = document.getElementById('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), Math.max(2500, text.length * 90));
  }
  function showOverlay(html) {
    el.overlayText.innerHTML = html;
    el.overlay.classList.add('show');
  }
  function hideOverlay() { el.overlay.classList.remove('show'); }

  // ゲームが始まるまで(カウントダウン中も)は移動・指示を送らない。
  // 送ると、止まっている間に溜まり、始まった瞬間に勝手に動いてしまう。
  let playing = false;
  function sendNow(obj) {
    if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
  }
  function send(obj) {
    if (obj.type === 'key') {
      if (!playing) return;
      pushKey(obj.code);       // 移動は先読みしてから送る
      return;
    }
    sendNow(obj);
  }

  // ---- 入力 ------------------------------------------------------------
  const KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
                        'Space', 'Enter', 'Escape']);
  // WASD でも同じように動けるようにする。ここで矢印キーに読み替えるので、
  // ここから先(送信・先読み・長押し)は矢印キーと同じ扱いになる。
  const WASD = { KeyW: 'ArrowUp', KeyA: 'ArrowLeft', KeyS: 'ArrowDown', KeyD: 'ArrowRight' };
  // 文字を打っている最中はゲームの操作として扱わない。参加者ID の欄で
  // W/A/S/D やスペースを打つと、移動の操作とみなして preventDefault して
  // いたため、その文字が入力できなかった。
  function typingInField(e) {
    const el = e.target;
    if (!el || el === document.body) return false;
    const tag = (el.tagName || '').toLowerCase();
    return tag === 'input' || tag === 'textarea' || tag === 'select'
      || el.isContentEditable === true;
  }
  window.addEventListener('keydown', (e) => {
    if (typingInField(e)) return;
    const code = WASD[e.code] || e.code;
    if (!KEYS.has(code)) return;
    e.preventDefault();   // 矢印/Space でのページスクロールを止める
    // 押しっぱなしは OS のキーリピートに任せず、こちらで一定の間隔にする
    // (実験条件をそろえるため。速さは入力の速さ n Hz と同じ)。
    if (e.repeat) return;
    if (DIRS[code] || code === 'Space') { if (playing) holdStart(code); return; }
    send({ type: 'key', code });
  });
  window.addEventListener('keyup', (e) => {
    if (typingInField(e)) return;
    holdEnd(WASD[e.code] || e.code);
  });
  window.addEventListener('blur', () => { [...held].forEach(holdEnd); });

  // マウス座標はサーバー側 Surface の座標へ戻して送る。
  // パネルは display の右側に置かれているので、x に baseW を足す。
  function toSurface(cv, e, offsetX) {
    const r = cv.getBoundingClientRect();
    return {
      x: Math.round((e.clientX - r.left) * cv.width / r.width) + offsetX,
      y: Math.round((e.clientY - r.top) * cv.height / r.height),
    };
  }
  function bindPointer(cv, getOffsetX) {
    // タッチには「ホバー」が無いので、押した位置へカーソルを動かしてから
    // クリックとして送る(指示パネルはホバー中のカードで選択を判定する)。
    cv.addEventListener('pointermove', (e) => {
      if (e.pointerType !== 'mouse') return;
      const p = toSurface(cv, e, getOffsetX());
      send({ type: 'mousemove', x: p.x, y: p.y });
    });
    cv.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      const p = toSurface(cv, e, getOffsetX());
      send({ type: 'mousemove', x: p.x, y: p.y });
      send({ type: 'mousedown', x: p.x, y: p.y });
    });
  }

  // 画面上のボタン。押している間は歩き続け、離すと止まる。
  // 十字キーは、押したまま指を滑らせて別の方向のボタンへ移ると、そこから
  // その方向へ歩く(いったん離して押し直さなくてよい)。指ごとに見ているので、
  // もう一方の指で「使う」を押していても影響しない。
  const pointerBtn = new Map();     // 指(pointerId) -> いま押しているボタン

  function buttonAt(x, y) {
    const el = document.elementFromPoint(x, y);
    return el && el.closest ? el.closest('#pad button') : null;
  }
  function pressButton(id, btn) {
    const code = btn.dataset.code;
    pointerBtn.set(id, btn);
    btn.classList.add('pressed');
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch (err) {} }
    if (DIRS[code] || btn.dataset.repeat) {
      if (playing) holdStart(code);
    } else {
      send({ type: 'key', code });
    }
  }
  function releaseButton(id) {
    const btn = pointerBtn.get(id);
    if (!btn) return;
    pointerBtn.delete(id);
    btn.classList.remove('pressed');
    holdEnd(btn.dataset.code);
  }

  pad.addEventListener('pointerdown', (e) => {
    const btn = buttonAt(e.clientX, e.clientY);
    if (!btn) return;
    e.preventDefault();
    // 指を滑らせても追えるよう、捕まえるのは個々のボタンではなく全体。
    try { pad.setPointerCapture(e.pointerId); } catch (err) {}
    pressButton(e.pointerId, btn);
  });
  // 十字キーを押している指は、スティックのように扱う。指の位置が十字の
  // 中心から見てどちら側かで方向が決まり、押したまま滑らせるだけで向きを
  // 変えられる。斜めには進めないので、縦と横のうち大きい方を採る。
  const dpadEl = document.querySelector('.dpad');
  function stickCode(x, y) {
    const r = dpadEl.getBoundingClientRect();
    const dx = x - (r.left + r.width / 2);
    const dy = y - (r.top + r.height / 2);
    // 真ん中あたりは、どちらとも決められないので今の方向のまま
    if (Math.abs(dx) < r.width * 0.12 && Math.abs(dy) < r.height * 0.12) return null;
    if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? 'ArrowRight' : 'ArrowLeft';
    return dy > 0 ? 'ArrowDown' : 'ArrowUp';
  }
  pad.addEventListener('pointermove', (e) => {
    const cur = pointerBtn.get(e.pointerId);
    if (!cur || !DIRS[cur.dataset.code]) return;   // 「使う」からは滑らせない
    const code = stickCode(e.clientX, e.clientY);
    if (!code || code === cur.dataset.code) return;
    const btn = document.querySelector(`#pad button[data-code="${code}"]`);
    if (!btn) return;
    releaseButton(e.pointerId);
    pressButton(e.pointerId, btn);
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((type) =>
    pad.addEventListener(type, (e) => releaseButton(e.pointerId)));
  pad.addEventListener('contextmenu', (e) => e.preventDefault());
  // ボタンの隙間を触ったときに、ページが拡大・スクロールしないように。
  pad.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });

  bindPointer(gameCv, () => 0);
  bindPointer(panelCv, () => baseW);

  // ---- 実験条件の表示 -------------------------------------------------

  applyPrefs();
  // 向きを変えたとき(縦↔横)やアドレスバーの出入りで、大きさを合わせ直す。
  window.addEventListener('resize', () => { updateCompact(); applyPrefs(); });
})();
</script>
</body>
</html>
